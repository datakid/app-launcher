<script>
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.reverb = null;
    this.rvbSend = null;
    this.enabled = false;
    this.scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77];
  }

  async _boot() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);

      const sr = this.ctx.sampleRate;
      const len = sr * 2.5;
      const buf = this.ctx.createBuffer(2, len, sr);

      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5) * Math.exp(-i / sr * 0.6);
        }
      }

      this.reverb = this.ctx.createConvolver();
      this.reverb.buffer = buf;
      this.rvbSend = this.ctx.createGain();
      this.rvbSend.gain.value = 0.25;
      this.reverb.connect(this.rvbSend);
      this.rvbSend.connect(this.ctx.destination);
    } catch (e) {}
  }

  _v(freq, type, t, dur, vol, freqEnd) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const env = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);

    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + Math.min(0.005, dur * 0.1));
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(env);
    env.connect(this.master);
    if (this.reverb) env.connect(this.reverb);

    osc.start(t);
    osc.stop(t + dur + 0.1);
  }

  async hover(idx = 0) {
    await this._boot();
    if (!this.ok()) return;
    const f = this.scale[((idx % this.scale.length) + this.scale.length) % this.scale.length];
    const t = this.ctx.currentTime;
    this._v(f, 'sine', t, 0.18, 0.02);
    this._v(f * 2, 'sine', t + 0.008, 0.12, 0.005);
  }

  async switchSweep(fromKey, toKey) {
    await this._boot();
    if (!this.ok()) return;
    const root = (k) => this.scale[((k % this.scale.length) + this.scale.length) % this.scale.length];
    const from = root(fromKey), to = root(toKey);
    const t = this.ctx.currentTime;
    this._v(from, 'sine', t, 0.18, 0.025, to);
    this._v(from * 1.5, 'sine', t, 0.18, 0.015, to * 1.5);
  }

  async click() {
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this._v(900, 'sine', t, 0.02, 0.03, 300);
    this._v(1046.50, 'sine', t, 0.4, 0.025);
    this._v(1318.51, 'sine', t + 0.02, 0.35, 0.015);
  }

  async arpUp() {
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this._v(f, 'sine', t + i * 0.08, 0.25, 0.04 - i * 0.006));
  }

  async chime(toLight) {
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    const ns = toLight ? [392, 493.88, 587.33, 698.46] : [698.46, 587.33, 493.88, 392];
    ns.forEach((f, i) => this._v(f, 'sine', t + i * 0.06, 0.25, 0.03));
  }

  ok() { return this.enabled && this.ctx && this.ctx.state === 'running'; }

  async resume() {
    await this._boot();
    if (this.ctx?.state === 'suspended') await this.ctx.resume();
  }
}

const sfx = new AudioEngine();

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const categories = JSON.parse(document.getElementById('lx-data').textContent).categories;

const LAYOUTS = {
  3: [['1/3', '1/3'], ['3/5', '1/3'], ['1/5', '3/4']],
  4: [['1/3', '1/2'], ['3/5', '1/2'], ['1/3', '2/4'], ['3/5', '2/4']],
  5: [['1/3', '1/2'], ['3/5', '1/2'], ['1/2', '2/4'], ['2/4', '2/4'], ['4/5', '2/4']],
  6: [['1/3', '1/2'], ['3/5', '1/2'], ['1/2', '2/4'], ['2/4', '2/3'], ['4/5', '2/4'], ['2/4', '3/4']],
  7: [['1/2', '1/2'], ['2/4', '1/2'], ['4/5', '1/2'], ['1/3', '2/3'], ['3/4', '2/3'], ['4/5', '2/3'], ['1/5', '3/4']]
};

const spanOf = (track) => {
  if (!track) return 1;
  const [a, b] = track.split('/').map(Number);
  return b - a;
};

const variantFor = (colTrack) => {
  const span = spanOf(colTrack);
  if (span >= 4) return 'card-hero';
  if (span >= 2) return 'card-wide';
  return null;
};

const getSelectedVariantIndex = (app) => {
  if (!app.variants) return -1;
  try {
    const stored = localStorage.getItem('lx-variant-' + app.title);
    if (stored !== null && app.variants[Number(stored)]) return Number(stored);
  } catch (e) {}
  return typeof app.defaultVariant === 'number' ? app.defaultVariant : 0;
};

const supportsAnchor = typeof CSS !== 'undefined' && CSS.supports('anchor-name', '--a');

const moveVariantIndicatorLegacy = (chipsEl, btn, instant) => {
  const indicator = chipsEl.querySelector('.variant-chip-indicator');
  if (!indicator || !btn) return;
  const p = chipsEl.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const x = b.left - p.left, w = b.width;
  const prevX = chipsEl._lastX ?? x;
  const dx = x - prevX;
  const stretch = Math.min(Math.abs(dx) / Math.max(w, 1), 0.3);

  indicator.style.width = `${w}px`;
  indicator.style.transformOrigin = dx >= 0 ? 'left center' : 'right center';

  if (instant) {
    indicator.style.transition = 'none';
    indicator.style.transform = `translateX(${x}px)`;
  } else {
    indicator.style.transition = 'transform 0.3s var(--ease-lux)';
    indicator.style.transform = `translateX(${x}px) scaleX(${1 + stretch})`;
    clearTimeout(chipsEl._settleTimer);
    chipsEl._settleTimer = setTimeout(() => {
      indicator.style.transition = 'transform 0.25s var(--ease-spring)';
      indicator.style.transform = `translateX(${x}px) scaleX(1)`;
    }, 140);
  }
  chipsEl._lastX = x;
};

const gradVars = (g) => `--c1:${g[0]};`;

const CLOSED_REASON_DEFAULT = 'هذا الرابط مغلق مؤقتًا وقد لا يعمل عند فتحه.';

const NEW_TTL_DAYS = 30;
const isFresh = (app) => {
  if (!app.since) return !!app.isNew;
  const t = Date.parse(app.since + 'T00:00:00');
  if (Number.isNaN(t)) return !!app.isNew;
  return (Date.now() - t) < NEW_TTL_DAYS * 86400000;
};

let pointerFieldDirty = true;

const createCard = (app, idx, colTrack, rowTrack) => {
  const el = document.createElement('div');
  const variantIndex = getSelectedVariantIndex(app);
  const activeVariant = app.variants ? app.variants[variantIndex] : null;
  const activeUrl = activeVariant ? activeVariant.url : app.url;
  const activeLabel = activeVariant ? `${app.title} — ${activeVariant.label}` : app.title;
  el.classList.add('app-card');
  el.dataset.appTitle = app.title;
  el.style.gridColumn = colTrack || '';
  el.style.gridRow = rowTrack || '';
  el.setAttribute('style', `${el.getAttribute('style') || ''}${gradVars(app.gradient)}`);
  el.style.setProperty('--i', idx);

  const variant = variantFor(colTrack);
  if (variant) el.classList.add(variant);
  if (app.closed) el.classList.add('status-closed');

  let badgesHtml = '';
  if (isFresh(app)) badgesHtml += `<div class="badge badge-new"><span class="badge-dot"></span>جديد</div>`;
  if (app.closed) badgesHtml += `<div class="badge badge-closed"><span class="badge-dot"></span>مغلق</div>`;
  if (app.variantBadge) badgesHtml += `<div class="badge badge-variant"><i class="fas fa-clone" aria-hidden="true"></i>${escapeHtml(app.variantBadge)}</div>`;

  const iconClass = activeVariant ? activeVariant.icon : app.icon;
  const digitHtml = idx < 9 ? `<span class="digit-badge" aria-hidden="true">${idx + 1}</span>` : '';

  const chipsHtml = app.variants ? `
      <div class="variant-chips" role="radiogroup" aria-label="اختر نسخة ${escapeHtml(app.title)}">
        <div class="variant-chip-indicator" aria-hidden="true"></div>
        ${app.variants.map((v, i) => `
          <button type="button" class="variant-chip${i === variantIndex ? ' is-active' : ''}" role="radio" aria-checked="${i === variantIndex}" data-variant-index="${i}">${escapeHtml(v.label)}</button>
        `).join('')}
      </div>` : '';

  const overlayLabel = app.closed ? `${activeLabel} — مغلق` : activeLabel;
  const overlayAttrs = `href="${escapeHtml(activeUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(overlayLabel)}"`;

  el.innerHTML = `
    <a class="card-link-overlay" ${overlayAttrs}></a>
    <div class="card-glow"></div>
    <div class="bento-header">
      <div class="app-icon-wrapper"><i class="app-icon fas ${iconClass}" aria-hidden="true"></i>${digitHtml}</div>
      ${badgesHtml ? `<div class="badges">${badgesHtml}</div>` : ''}
    </div>
    <div class="bento-footer">
      <div class="title-row">
        <h3 class="app-title">${escapeHtml(app.title)}</h3>
        <span class="open-affordance" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
      </div>
      ${chipsHtml}
    </div>
  `;

  el.addEventListener('click', () => sfx.click());
  el.addEventListener('mouseenter', () => sfx.hover(idx));
  el.addEventListener('focusin', () => sfx.hover(idx));

  if (app.variants) {
    const chipsEl = el.querySelector('.variant-chips');
    const iconEl = el.querySelector('.app-icon');
    const linkEl = el.querySelector('.card-link-overlay');

    const applyVariant = (i) => {
      const v = app.variants[i];
      if (!v) return;
      linkEl.href = v.url;
      linkEl.setAttribute('aria-label', app.closed ? `${app.title} — ${v.label} — مغلق` : `${app.title} — ${v.label}`);
      chipsEl.querySelectorAll('.variant-chip').forEach((chip, ci) => {
        chip.classList.toggle('is-active', ci === i);
        chip.setAttribute('aria-checked', String(ci === i));
      });
      if (!supportsAnchor) moveVariantIndicatorLegacy(chipsEl, chipsEl.querySelector('.variant-chip.is-active'), false);
      iconEl.style.opacity = '0';
      setTimeout(() => {
        iconEl.className = `app-icon fas ${v.icon}`;
        iconEl.style.opacity = '1';
      }, 175);
      try { localStorage.setItem('lx-variant-' + app.title, String(i)); } catch (e) {}
      sfx.click();
    };

    chipsEl.querySelectorAll('.variant-chip').forEach((chip, i) => {
      chip.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        applyVariant(i);
      });
    });

    if (!supportsAnchor) {
      requestAnimationFrame(() => moveVariantIndicatorLegacy(chipsEl, chipsEl.querySelector('.variant-chip.is-active'), true));
    }
  }

  return el;
};

const renderCards = (grid, categoryId) => {
  const cat = categories.find(c => c.id === categoryId);
  const layout = LAYOUTS[cat.apps.length];
  grid.classList.toggle('is-auto-flow', !layout);
  const frag = document.createDocumentFragment();
  cat.apps.forEach((app, i) => {
    const track = layout ? layout[i] : null;
    const card = createCard(app, i, track ? track[0] : null, track ? track[1] : null);
    if (!layout && i === 0) card.classList.add('card-wide');
    frag.appendChild(card);
  });
  grid.innerHTML = '';
  grid.appendChild(frag);
  pointerFieldDirty = true;
};

const initPointerField = () => {
  const grid = document.getElementById('appGrid');
  const container = document.querySelector('.container');
  const spot = document.getElementById('spotlight');
  if (!grid || !container) return;
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  const REVEAL_RADIUS = 260;
  let cards = [];
  let px = -9999, py = -9999;
  let sx = -9999, sy = -9999;
  let hasPointer = false;
  let lastMove = 0;

  const measure = () => {
    cards = Array.from(grid.querySelectorAll('.app-card'));
    const cr = container.getBoundingClientRect();
    cards.forEach(c => {
      c._r = {
        left: cr.left + c.offsetLeft,
        top: cr.top + c.offsetTop,
        right: cr.left + c.offsetLeft + c.offsetWidth,
        bottom: cr.top + c.offsetTop + c.offsetHeight
      };
    });
    pointerFieldDirty = false;
  };

  const frame = () => {
    if (pointerFieldDirty) measure();
    const wantsTilt = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    cards.forEach(c => {
      const r = c._r;
      if (!r) return;
      const dx = px < r.left ? r.left - px : px > r.right ? px - r.right : 0;
      const dy = py < r.top ? r.top - py : py > r.bottom ? py - r.bottom : 0;
      const d = Math.hypot(dx, dy);
      let o = d >= REVEAL_RADIUS ? 0 : 1 - d / REVEAL_RADIUS;
      o *= o;
      if (o === 0 && (c._o ?? 0) === 0) return;
      c._o = o;
      c.style.setProperty('--reveal-o', String(o * 0.9));
      c.style.setProperty('--rx', `${px - r.left}px`);
      c.style.setProperty('--ry', `${py - r.top}px`);

      const inside = px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
      if (inside) {
        c.classList.add('is-tracking');
        const cx = px - r.left, cy = py - r.top;
        c.style.setProperty('--mx', `${cx}px`);
        c.style.setProperty('--my', `${cy}px`);
        if (wantsTilt) {
          const nx = (cx - (r.right - r.left) / 2) / ((r.right - r.left) / 2);
          const ny = (cy - (r.bottom - r.top) / 2) / ((r.bottom - r.top) / 2);
          c.style.setProperty('--tx', String(nx));
          c.style.setProperty('--ty', String(ny));
        }
      } else if (c.classList.contains('is-tracking')) {
        c.classList.remove('is-tracking');
        c.style.removeProperty('--mx');
        c.style.removeProperty('--my');
        c.style.removeProperty('--tx');
        c.style.removeProperty('--ty');
      }
    });

    if (spot) {
      if (hasPointer) {
        sx += (px - sx) * 0.14;
        sy += (py - sy) * 0.14;
      } else {
        sx = px; sy = py;
      }
      spot.style.setProperty('--sx', `${sx}px`);
      spot.style.setProperty('--sy', `${sy}px`);
      spot.classList.toggle('is-active', hasPointer);
      spot.classList.toggle('is-idle', hasPointer && (performance.now() - lastMove > 2200));
    }

    requestAnimationFrame(frame);
  };

  document.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    px = e.clientX; py = e.clientY;
    if (!hasPointer) { sx = px; sy = py; }
    hasPointer = true;
    lastMove = performance.now();
  }, { passive: true });

  document.addEventListener('pointerleave', () => {
    px = -9999; py = -9999;
    hasPointer = false;
  });

  window.addEventListener('resize', () => { pointerFieldDirty = true; }, { passive: true });
  window.addEventListener('scroll', () => { pointerFieldDirty = true; }, { passive: true, capture: true });

  measure();
  requestAnimationFrame(frame);
};

let isLightTheme = false;

class OrbField {
  constructor(canvas) {
    this.cv = canvas;
    this.cx = canvas.getContext('2d');
    this.t = 0;
    this.orbs = [];
    this.running = false;
    this.rafId = null;
    this.resize();
    this.spawn();
    this.start();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.stop(); else this.start();
    });
  }

  resize() {
    this.cv.width = window.innerWidth;
    this.cv.height = window.innerHeight;
  }

  spawn() {
    const n = window.innerWidth < 768 ? 4 : 6;
    this.orbs = Array.from({ length: n }, (_, i) => ({
      x: Math.random() * this.cv.width,
      y: Math.random() * this.cv.height,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 300 + 200,
      hue: isLightTheme ? [205, 225, 195][i % 3] : [222, 258, 195][i % 3],
      phase: Math.random() * Math.PI * 2
    }));
  }

  start() {
    if (this.running || document.hidden) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.running = true;
    this.tick();
  }

  stop() {
    this.running = false;
    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
  }

  tick() {
    if (!this.running) return;
    this.t += 0.001;
    this.cx.clearRect(0, 0, this.cv.width, this.cv.height);
    this.cx.globalCompositeOperation = isLightTheme ? 'multiply' : 'screen';

    this.orbs.forEach(o => {
      o.x += o.vx + Math.sin(this.t + o.phase) * 0.2;
      o.y += o.vy + Math.cos(this.t + o.phase) * 0.2;

      if (o.x < -o.r) o.x = this.cv.width + o.r;
      if (o.x > this.cv.width + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = this.cv.height + o.r;
      if (o.y > this.cv.height + o.r) o.y = -o.r;

      const g = this.cx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      const a = isLightTheme ? 0.2 : 0.3;
      g.addColorStop(0, `hsla(${o.hue}, 78%, ${isLightTheme ? 60 : 40}%, ${a})`);
      g.addColorStop(0.4, `hsla(${o.hue}, 68%, ${isLightTheme ? 70 : 30}%, ${a * 0.4})`);
      g.addColorStop(1, 'transparent');

      this.cx.fillStyle = g;
      this.cx.beginPath();
      this.cx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      this.cx.fill();
    });

    this.rafId = requestAnimationFrame(() => this.tick());
  }
}

const getStoredTheme = () => {
  try { return localStorage.getItem('lx-theme'); } catch (e) { return null; }
};

const applyTheme = (explicit) => {

let lastX = 0;
let indicatorTimer;
let activeViewTransition = null;
let currentTabId = null;

const catIndex = (id) => categories.findIndex(c => c.id === id);

const applyTabAccent = (btn) => {};

const moveIndicatorLegacy = (btn, instant) => {
  const rail = document.getElementById('tabRail');
  const ind = document.getElementById('tabIndicator');
  const trail = document.getElementById('tabIndicatorTrail');
  const glow = document.getElementById('tabIndicatorGlow');
  if (!rail || !ind || !trail || !btn) return;

  const p = rail.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const x = b.left - p.left, w = b.width;
  const dx = x - lastX;
  const stretch = Math.min(Math.abs(dx) / Math.max(w, 1), 0.55);

  clearTimeout(indicatorTimer);

  ind.style.width = `${w}px`;
  trail.style.width = `${w}px`;
  ind.style.transformOrigin = dx >= 0 ? 'left center' : 'right center';
  if (glow) glow.style.width = `${w}px`;

  if (instant) {
    ind.style.transition = 'none';
    ind.style.transform = `translateX(${x}px)`;
    trail.style.transition = 'none';
    trail.style.transform = `translateX(${x}px)`;
    if (glow) { glow.style.transition = 'none'; glow.style.transform = `translateX(${x}px)`; }
  } else {
    ind.style.transition = 'transform 0.42s var(--ease-lux)';
    ind.style.transform = `translateX(${x}px) scaleX(${1 + stretch}) scaleY(${1 - stretch * 0.35})`;
    trail.style.transition = 'transform 0.5s var(--ease-spring) 0.06s, width 0.5s var(--ease-spring) 0.06s';
    trail.style.transform = `translateX(${x}px)`;
    if (glow) { glow.style.transition = 'transform 0.42s var(--ease-lux)'; glow.style.transform = `translateX(${x}px)`; }
    indicatorTimer = setTimeout(() => {
      ind.style.transition = 'transform 0.5s var(--ease-spring)';
      ind.style.transform = `translateX(${x}px) scaleX(1) scaleY(1)`;
    }, 190);
  }
  lastX = x;
};

const activateTab = (id, opts = {}) => {
  const { pushHash = true, playSound = true, instant = false } = opts;
  if (!categories.some(c => c.id === id)) return Promise.resolve();
  const prevId = currentTabId;
  const dir = prevId ? (catIndex(id) > catIndex(prevId) ? 1 : -1) : 1;
  currentTabId = id;

  setActiveButtonStates(id);
  const activeBtn = document.getElementById(`tab-${id}`);
  applyTabAccent(activeBtn);
  if (!supportsAnchor) moveIndicatorLegacy(activeBtn, instant);

  const g = document.getElementById('appGrid');
  const cat = categories.find(c => c.id === id);
  g.setAttribute('aria-labelledby', `tab-${id}`);

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.style.setProperty('--dir', dir);

  const run = () => renderCards(g, id);

  let rendered;
  if (instant || reducedMotion) {
    run();
    rendered = Promise.resolve();
  } else if (document.startViewTransition) {
    if (activeViewTransition) { try { activeViewTransition.skipTransition(); } catch (e) {} }
    activeViewTransition = document.startViewTransition(run);
    rendered = activeViewTransition.finished.catch(() => {}).finally(() => { activeViewTransition = null; });
  } else {
    g.classList.add('is-out');
    rendered = new Promise((resolve) => {
      setTimeout(() => { run(); g.classList.remove('is-out'); resolve(); }, 220);
    });
  }

  try { localStorage.setItem('lx-last-tab', id); } catch (e) {}
  if (pushHash && location.hash.replace('#', '') !== id) location.hash = id;

  if (playSound && prevId && prevId !== id) {
    const prevCat = categories.find(c => c.id === prevId);
    if (prevCat) sfx.switchSweep(prevCat.key, cat.key);
  }

  return rendered;
};

const normalizeAr = (s) => s.toLowerCase()
  .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي')
  .replace(/[ةه]/g, 'ه').replace(/[ؤئ]/g, 'ء')
  .replace(/\s+/g, ' ').trim();

const normMap = (s) => {
  let out = '', map = [];
  for (let i = 0; i < s.length; i++) {
    let c = s[i].toLowerCase();
    if (/[\u064B-\u0652\u0670\u0640]/.test(c)) continue;
    c = c.replace(/[أإآٱ]/, 'ا').replace(/ى/, 'ي').replace(/[ةه]/, 'ه').replace(/[ؤئ]/, 'ء');
    out += c; map.push(i);
  }
  return { out, map };
};

const highlightTitle = (title, query) => {
  const nq = normalizeAr(query);
  if (!nq) return escapeHtml(title);
  const { out, map } = normMap(title);
  const hits = new Set();

  const i = out.indexOf(nq);
  if (i >= 0) {
    for (let k = i; k < i + nq.length; k++) hits.add(map[k]);
  } else {
    let qi = 0;
    for (let k = 0; k < out.length && qi < nq.length; k++) {
      if (out[k] === nq[qi]) { hits.add(map[k]); qi++; }
    }
    if (qi < nq.length) return escapeHtml(title);
  }

  let idx = 0;
  return title.split(/(\s+)/).map((part) => {
    const start = idx;
    idx += part.length;
    if (/^\s+$/.test(part)) return escapeHtml(part);
    let matched = false;
    for (let k = start; k < start + part.length; k++) if (hits.has(k)) { matched = true; break; }
    return matched ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part);
  }).join('');
};

const fuzzyScore = (query, target) => {
  const t = normalizeAr(target), q = normalizeAr(query);
  if (!q) return 0;
  const i = t.indexOf(q);
  if (i === 0) return 1000;
  if (i > 0 && t[i - 1] === ' ') return 850;
  if (i > 0) return 700 - i;
  let qi = 0, run = 0, s = 0;
  for (let k = 0; k < t.length && qi < q.length; k++) {
    if (t[k] === q[qi]) { qi++; run++; s += 4 + run * 3; } else run = 0;
  }
  return qi === q.length ? s : -1;
};

const allPaletteEntries = () => {

const RECENTS_KEY = 'lx-recents';
const RECENTS_CAP = 8;

const getRecentTitles = () => {
  try {
    const stored = JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]');
    return Array.isArray(stored) ? stored : [];
  } catch (e) { return []; }
};

const pushRecent = (title) => {
  try {
    const list = getRecentTitles().filter(t => t !== title);
    list.unshift(title);
    localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0, RECENTS_CAP)));
  } catch (e) {}
};

const getRecentEntries = (allEntries, limit) => {
  const titles = getRecentTitles();
  const byTitle = new Map();
  allEntries.forEach(e => { if (!byTitle.has(e.app.title)) byTitle.set(e.app.title, e); });
  const out = [];
  for (const t of titles) {
    const e = byTitle.get(t);
    if (e) out.push(e);
    if (out.length >= limit) break;
  }
  return out;
};

const scoreEntry = (query, entry) => {
  const titleScore = fuzzyScore(query, entry.app.title);
  const titleEnScore = entry.app.titleEn ? fuzzyScore(query, entry.app.titleEn) : -1;
  const catScore = fuzzyScore(query, entry.cat.label);
  let hostScore = -1;
  try { hostScore = fuzzyScore(query, new URL(entry.app.url).hostname) * 0.4; } catch (e) {}
  return Math.max(titleScore, titleEnScore, catScore, hostScore);
};

const paletteItemHtml = (e, globalIndex, query) => `

const renderPaletteResults = (query) => {
  const paletteResults = document.getElementById('paletteResults');
  const allEntries = allPaletteEntries();
  const scored = allEntries
    .map(e => ({ app: e.app, cat: e.cat, score: scoreEntry(query, e) }))
    .filter(e => e.score >= 0)
    .sort((a, b) => b.score - a.score);

  let html = '';

  if (!query && !scored.length) {
    paletteItems = [];
  } else if (!query) {
    paletteTryPicks = null;
    const recents = getRecentEntries(allEntries, 5);
    const recentTitles = new Set(recents.map(e => e.app.title));
    const rest = scored.filter(e => !recentTitles.has(e.app.title));
    paletteItems = [...recents, ...rest];
    if (recents.length) {
      html += `<li class="palette-group-header" role="presentation">الأخيرة</li>`;
      recents.forEach((e, i) => { html += paletteItemHtml(e, i, query); });
      html += `<li class="palette-group-header" role="presentation">الكل</li>`;
      rest.forEach((e, i) => { html += paletteItemHtml(e, recents.length + i, query); });
    } else {
      rest.forEach((e, i) => { html += paletteItemHtml(e, i, query); });
    }
  } else if (scored.length) {
    paletteTryPicks = null;
    paletteItems = scored;
    scored.forEach((e, i) => { html += paletteItemHtml(e, i, query); });
  } else {
    if (!paletteTryPicks) {
      const pool = allEntries.filter(e => e.cat.id !== '_secret');
      const picks = [];
      const used = new Set();
      while (picks.length < Math.min(3, pool.length)) {
        const idx = Math.floor(Math.random() * pool.length);
        if (used.has(idx)) continue;
        used.add(idx);
        picks.push(pool[idx]);
      }
      paletteTryPicks = picks;
    }
    paletteItems = paletteTryPicks;
    html += `<li class="palette-group-header" role="presentation">جرّب</li>`;
    paletteTryPicks.forEach((e, i) => { html += paletteItemHtml(e, i, ''); });
  }

  paletteActiveIndex = paletteItems.length ? 0 : -1;
  paletteActionIndex = 0;
  paletteZone = 'list';

  paletteResults.innerHTML = html || `<li class="palette-empty">لا توجد نتائج</li>`;

  paletteResults.querySelectorAll('.palette-item').forEach(li => {
    li.addEventListener('mouseenter', () => setPaletteActive(Number(li.dataset.index)));
    li.addEventListener('click', () => openPaletteItem(Number(li.dataset.index)));
  });

  updateActiveDescendant();
  updateLiveAccent();
  renderPaletteDetail();
};

const copyToClipboard = async (text) => {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
};

const showActionFeedback = (actionId, ok, okLabel, failLabel) => {
  const btn = document.querySelector(`.palette-action[data-action="${actionId}"]`);
  if (!btn) return;
  clearTimeout(actionFeedbackTimer);
  const icon = btn.querySelector('i');
  const label = btn.querySelector('.palette-action-label');
  const prevIconClass = icon.className;
  const prevLabelText = label.textContent;
  const msg = ok ? okLabel : failLabel;
  icon.className = ok ? 'fas fa-check' : 'fas fa-triangle-exclamation';
  label.textContent = msg;
  announcePalette(msg);
  actionFeedbackTimer = setTimeout(() => {
    icon.className = prevIconClass;
    label.textContent = prevLabelText;
  }, 1400);
};

const revealInGrid = async (entry) => {
  if (entry.cat.id === '_secret') return;
  const targetTitle = entry.app.parentTitle || entry.app.title;
  const targetCatId = entry.cat.id;
  closePalette();
  if (currentTabId !== targetCatId) await activateTab(targetCatId);
  requestAnimationFrame(() => {
    const card = document.querySelector(`#appGrid .app-card[data-app-title="${CSS.escape(targetTitle)}"]`);
    if (!card) return;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    card.scrollIntoView({ block: 'center', behavior: reducedMotion ? 'auto' : 'smooth' });
    card.classList.add('is-revealed');
    card.addEventListener('animationend', () => card.classList.remove('is-revealed'), { once: true });
  });
};

const executeAction = async (actionId) => {
  const entry = paletteItems[paletteActiveIndex];
  if (!entry) return;
  if (entry.app.parentTitle && (actionId === 'new-tab' || actionId === 'same-tab')) {
    try { localStorage.setItem('lx-variant-' + entry.app.parentTitle, String(entry.app.variantIndex)); } catch (e) {}
  }
  if (actionId === 'new-tab' || actionId === 'same-tab') {
    pushRecent(entry.app.title);
  }
  if (actionId === 'new-tab') {
    sfx.click();
    window.open(entry.app.url, '_blank', 'noopener');
    closePalette();
  } else if (actionId === 'same-tab') {
    sfx.click();
    window.location.href = entry.app.url;
  } else if (actionId === 'copy-link') {
    const ok = await copyToClipboard(entry.app.url);
    sfx.click();
    showActionFeedback('copy-link', ok, 'تم نسخ الرابط', 'تعذر النسخ');
  } else if (actionId === 'copy-title') {
    const ok = await copyToClipboard(entry.app.parentTitle || entry.app.title);
    sfx.click();
    showActionFeedback('copy-title', ok, 'تم نسخ الاسم', 'تعذر النسخ');
  } else if (actionId === 'reveal') {
    sfx.click();
    await revealInGrid(entry);
  }
};

const openPaletteItem = (i) => {
  paletteActiveIndex = i;
  executeAction('new-tab');
};

const openPalette = () => {
  const dialog = document.getElementById('lx-palette');
  if (dialog.open) return;
  const input = document.getElementById('paletteInput');
  input.value = '';
  paletteTryPicks = null;
  renderPaletteResults('');
  document.querySelector('.container').classList.add('is-dollied');
  document.querySelector('.controls-pill').classList.add('is-dollied');
  dialog.showModal();
  requestAnimationFrame(() => input.focus());
};

const closePalette = () => {
  const dialog = document.getElementById('lx-palette');
  if (dialog.open) dialog.close();
};

const togglePalette = () => {
  const dialog = document.getElementById('lx-palette');
  if (dialog.open) closePalette(); else openPalette();
};

const setupInteractions = () => {
  applyTheme();
  buildTabRail();

  const initialTab = getInitialTab();
  activateTab(initialTab, { pushHash: false, playSound: false, instant: true });
  initPointerField();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (!supportsAnchor) moveIndicatorLegacy(document.getElementById(`tab-${currentTabId}`), true);
      document.documentElement.classList.add('fonts-ready');
    });
  } else {
    document.documentElement.classList.add('fonts-ready');
  }

  const canvas = document.getElementById('gradient-canvas');
  window.bgAnim = new OrbField(canvas);

  let debTimer;
  window.addEventListener('resize', () => {
    clearTimeout(debTimer);
    debTimer = setTimeout(() => {
      window.bgAnim.resize();
      if (!supportsAnchor) moveIndicatorLegacy(document.getElementById(`tab-${currentTabId}`), true);
    }, 180);
  });

  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
    if (getStoredTheme()) return;
    applyTheme();
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const isLight = document.documentElement.dataset.theme !== 'light';
    applyTheme(isLight ? 'light' : 'dark');
    sfx.chime(isLight);
  });

  const soundBtn = document.getElementById('soundToggle');
  soundBtn.addEventListener('click', async () => {
    await sfx.resume();
    sfx.enabled = !sfx.enabled;
    soundBtn.setAttribute('aria-pressed', String(sfx.enabled));
    soundBtn.setAttribute('aria-label', sfx.enabled ? 'كتم الصوت' : 'تفعيل الصوت');
    soundBtn.querySelector('i').className = `fas ${sfx.enabled ? 'fa-volume-up' : 'fa-volume-mute'}`;
    if (sfx.enabled) sfx.arpUp();
  });

  document.body.addEventListener('keydown', (e) => {
    if (e.key === 'Alt') document.body.classList.add('is-alt-down');
  });
  document.body.addEventListener('keyup', (e) => {
    if (e.key === 'Alt') document.body.classList.remove('is-alt-down');
  });
  window.addEventListener('blur', () => document.body.classList.remove('is-alt-down'));

  let secretCode = '';
  let secretTimer;

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key.length !== 1 || e.metaKey || e.ctrlKey || e.altKey) return;

    clearTimeout(secretTimer);
    secretCode += e.key.toLowerCase();
    secretTimer = setTimeout(() => secretCode = '', 4200);

    const hit = Object.keys(secretApps).find(k => secretCode.endsWith(k));
    if (hit) {
      sfx.click();
      window.open(secretApps[hit].url, '_blank', 'noopener');
      unlockSecret(hit);
      secretCode = '';
    }
  });

  window.addEventListener('popstate', handleHashNav);
  window.addEventListener('hashchange', handleHashNav);

  document.getElementById('tabRail').addEventListener('keydown', (e) => {
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    const i = tabs.findIndex(t => t.dataset.id === currentTabId);
    if (i === -1) return;
    let next = null;
    if (e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
    else if (e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
    else if (e.key === 'Home') next = tabs[0];
    else if (e.key === 'End') next = tabs[tabs.length - 1];
    if (next) {
      e.preventDefault();
      activateTab(next.dataset.id);
      next.focus();
    }
  });

  let touchStartX = 0, touchStartY = 0;
  const appGrid = document.getElementById('appGrid');
  appGrid.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  appGrid.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const i = catIndex(currentTabId);
    const next = dx < 0 ? categories[i + 1] : categories[i - 1];
    if (next) activateTab(next.id);
  }, { passive: true });

  const paletteDialog = document.getElementById('lx-palette');
  const paletteInput = document.getElementById('paletteInput');

  paletteInput.addEventListener('input', () => {
    const raw = paletteInput.value;
    const hit = Object.keys(secretApps).find(k => normalizeAr(raw) === k);
    if (hit && !unlockedSecrets.has(hit)) {
      unlockSecret(hit);
      sfx.arpUp();
      paletteInput.value = '';
      renderPaletteResults('');
      return;
    }
    renderPaletteResults(raw);
  });

  paletteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      if (paletteActiveIndex === -1) return;
      e.preventDefault();
      paletteZone = paletteZone === 'list' ? 'actions' : 'list';
      if (paletteZone === 'actions') paletteActionIndex = 0;
      updateActionHighlight();
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (paletteZone === 'actions') {
        const n = getActionsForEntry(paletteItems[paletteActiveIndex]).length;
        paletteActionIndex = (paletteActionIndex + 1) % n;
        updateActionHighlight();
      } else if (paletteItems.length) {
        setPaletteActive((paletteActiveIndex + 1) % paletteItems.length);
      }
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (paletteZone === 'actions') {
        const n = getActionsForEntry(paletteItems[paletteActiveIndex]).length;
        paletteActionIndex = (paletteActionIndex - 1 + n) % n;
        updateActionHighlight();
      } else if (paletteItems.length) {
        setPaletteActive((paletteActiveIndex - 1 + paletteItems.length) % paletteItems.length);
      }
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (paletteActiveIndex === -1) return;
      if (e.shiftKey) { executeAction('same-tab'); return; }
      if (e.ctrlKey || e.metaKey) { executeAction('copy-link'); return; }
      if (paletteZone === 'actions') { executeAction(getActionsForEntry(paletteItems[paletteActiveIndex])[paletteActionIndex].id); return; }
      executeAction('new-tab');
      return;
    }
  });

  paletteDialog.addEventListener('close', () => {
    document.querySelector('.container').classList.remove('is-dollied');
    document.querySelector('.controls-pill').classList.remove('is-dollied');
  });

  document.getElementById('paletteToggle').addEventListener('click', () => togglePalette());

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      togglePalette();
      return;
    }
    if (paletteDialog.open) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (/^[1-9]$/.test(e.key)) {
      const cards = document.querySelectorAll('#appGrid .app-card');
      const card = cards[Number(e.key) - 1];
      if (card) card.querySelector('.card-link-overlay')?.click();
    }
  });
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setupInteractions);
} else {
  setupInteractions();
}
</script>
</body>
</html>
