<meta name="theme-color" content="#050608">
<script>
(function () {
  try {
    var theme = localStorage.getItem('lx-theme');
    var isLight = (theme === 'light' || theme === 'dark')
      ? theme === 'light'
      : window.matchMedia('(prefers-color-scheme: light)').matches;
    var storedLang = localStorage.getItem('lx-lang');
    var lang = (storedLang === 'ar' || storedLang === 'en')
      ? storedLang
      : ((navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'ar');
    var root = document.documentElement;
    root.dataset.theme = isLight ? 'light' : 'dark';
    root.lang = lang;
    root.dir = lang === 'en' ? 'ltr' : 'rtl';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isLight ? '#f3f1ec' : '#050608');
  } catch (e) {}
})();
</script>

<style>
:root {
  color-scheme: dark;
  --bg: light-dark(#f3f1ec, #050608);
  --surface: light-dark(rgba(255,255,255,0.55), rgba(255,255,255,0.028));
  --surface-hover: light-dark(rgba(255,255,255,0.86), rgba(255,255,255,0.058));
  --border: light-dark(rgba(20,18,15,0.06), rgba(255,255,255,0.07));
  --border-highlight: light-dark(rgba(20,18,15,0.16), rgba(255,255,255,0.3));
  --text: light-dark(#15130f, #f6f5f2);
  --text-muted: light-dark(rgba(21,19,15,0.52), rgba(246,245,242,0.52));
  --shadow-soft: light-dark(0 1px 2px rgba(28,25,20,.05), 0 1px 2px rgba(0,0,0,.3)), light-dark(0 10px 28px -14px rgba(28,25,20,.14), 0 10px 30px -14px rgba(0,0,0,.6));
  --shadow-deep: light-dark(0 2px 8px rgba(28,25,20,.07), 0 2px 6px rgba(0,0,0,.34)), light-dark(0 30px 60px -22px rgba(28,25,20,.18), 0 30px 64px -22px rgba(0,0,0,.72));
  --radius: 22px;
  --gap: clamp(0.75rem, 1.8vh, 1.3rem);
  --ease-lux: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.4, 1);
  --ease-pill: linear(0, 0.42 8.4%, 1.14 24.4%, 0.88 39.6%, 1.03 56.4%, 0.98 73.2%, 1 100%);
  --dur-micro: 160ms;
  --dur-fast: 300ms;
  --dur-base: 380ms;
  --dur-slow: 620ms;
  --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='a'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23a)' opacity='0.05'/%3E%3C/svg%3E");
  --ui-font: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --display-font: 'El Messiri', var(--ui-font);
}

:root:lang(en) {
  --ui-font: 'Inter', system-ui, sans-serif;
  --display-font: 'Cormorant Garamond', Georgia, serif;
}

:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

@property --live-accent { syntax: '<color>'; inherits: true; initial-value: #7c9bff; }
@property --mx { syntax: '<length-percentage>'; inherits: true; initial-value: 50%; }
@property --my { syntax: '<length-percentage>'; inherits: true; initial-value: -20%; }
@property --tx { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --ty { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --tz { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --sc { syntax: '<number>'; inherits: false; initial-value: 1; }
@property --hov { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --tab-accent { syntax: '<color>'; inherits: true; initial-value: #7c9bff; }
:root { transition-property: --tab-accent; transition-duration: 0.34s; transition-timing-function: var(--ease-lux); }
@property --rx { syntax: '<length-percentage>'; inherits: true; initial-value: -9999px; }
@property --ry { syntax: '<length-percentage>'; inherits: true; initial-value: -9999px; }
@property --reveal-o { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --reveal-r { syntax: '<length>'; inherits: true; initial-value: 230px; }

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; font-synthesis: none; }

html,body { height: 100dvh; width: 100vw; overflow: hidden; }

body {
  font-family: var(--ui-font);
  font-optical-sizing: auto;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background 1s var(--ease-smooth), color 1s var(--ease-smooth);
}

a, button { cursor: pointer; }

:focus-visible {
  outline: 2px solid color-mix(in oklab, var(--tint, #7c9bff) 70%, var(--text));
  outline-offset: 3px;
  border-radius: 8px;
}

#lx-palette :focus-visible {
  outline-color: color-mix(in oklab, var(--live-accent) 70%, var(--text));
}
:root[data-theme="light"] :focus-visible { outline-color: color-mix(in oklab, var(--tint, #7c9bff) 45%, #15130f); }

::selection { background: color-mix(in oklab, var(--text) 22%, transparent); }
.app-grid ::selection { background: color-mix(in oklab, var(--tab-accent) 35%, var(--text) 18%); }

#gradient-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; filter: blur(60px);
  transform: scale(1.3); opacity: 0;
  animation: fadeIn 2.5s var(--ease-lux) forwards;
}

.scrim {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(circle at center, transparent 22%, color-mix(in oklab, var(--tab-accent) 3%, var(--bg)) 118%);
  transition: background 1s var(--ease-smooth);
}

.scrim::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: var(--noise);
  background-repeat: repeat; background-size: 180px 180px;
  opacity: 0.26; mix-blend-mode: overlay;
}
:root[data-theme="light"] .scrim::after { opacity: 0.14; }

.spotlight {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background:
    radial-gradient(900px circle at var(--sx, 50%) var(--sy, 15%), light-dark(rgba(255,252,245,0.22), rgba(255,255,255,0.03)), transparent 70%),
    radial-gradient(320px circle at var(--sx, 50%) var(--sy, 15%), light-dark(rgba(255,255,255,0.13), rgba(255,255,255,0.022)), transparent 70%);
  background:
    radial-gradient(900px circle at var(--sx, 50%) var(--sy, 15%), color-mix(in oklab, var(--tab-accent) 5%, light-dark(rgba(255,252,245,0.22), rgba(255,255,255,0.03))), transparent 70%),
    radial-gradient(320px circle at var(--sx, 50%) var(--sy, 15%), color-mix(in oklab, var(--tab-accent) 5%, light-dark(rgba(255,255,255,0.13), rgba(255,255,255,0.022))), transparent 70%);
  opacity: 0;
  transition: opacity 0.6s var(--ease-lux);
}

.spotlight.is-active { opacity: 1; }
.spotlight.is-active.is-idle { opacity: 0.45; }
body:has(.app-card:hover) .spotlight.is-active { opacity: 0.3; }

.container {
  width: 100%; max-width: 1400px; height: 100dvh;
  padding: clamp(3rem, 5vh, 4.5rem) clamp(1.5rem, 4vw, 3.5rem) clamp(1.5rem, 3vh, 2.5rem);
  position: relative; z-index: 3;
  display: flex; flex-direction: column; gap: clamp(1.5rem, 3vh, 2.5rem);
  transition: transform 0.45s var(--ease-lux), filter 0.45s var(--ease-lux);
}

.container.is-dollied, .controls-pill.is-dollied {
  transform: scale(0.96); filter: blur(9px) brightness(0.75);
}

.site-header {
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  animation: slideDown 0.9s var(--ease-lux) both;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400; font-style: italic;
  font-size: clamp(2.6rem, 5.4vw, 5.6rem);
  letter-spacing: -0.008em; line-height: 1.1;
  background: linear-gradient(135deg, light-dark(#0f172a, #ffffff) 0%, light-dark(#2563eb, #b4c6ff) 40%, light-dark(#0f172a, #ffffff) 80%);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 14px light-dark(rgba(20,18,15,.1), rgba(0,0,0,.35)));
  margin: 0 20px;
  padding: 0.15em 0;
}

.fonts-ready h1 { animation: shimmerText 3.6s var(--ease-lux) .35s 1 both; }

@keyframes shimmerText { to { background-position: 100% center; } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-16px); filter: blur(5px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.controls-pill {
  position: fixed; top: 1.5rem; left: 1.5rem;
  display: flex; align-items: center;
  background: light-dark(rgba(255,255,255,0.62), rgba(255,255,255,0.025));
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: 50px; padding: 0.35rem; gap: 0.2rem;
  z-index: 100;
  box-shadow: var(--shadow-soft), inset 0 1px 1px light-dark(rgba(255,255,255,0.9), rgba(255,255,255,0.05));
  transition: transform 0.45s var(--ease-lux), filter 0.45s var(--ease-lux), background 0.6s var(--ease-smooth);
}

.controls-pill button {
  background: transparent; border: none; color: var(--text-muted);

  padding: 1px; z-index: 4; pointer-events: none;

.card-tall .app-icon-wrapper { width: clamp(64px, 8.4vh, 84px); height: clamp(64px, 8.4vh, 84px); border-radius: 17px; }
.card-tall .app-icon { font-size: clamp(1.7rem, 3.6vh, 2.2rem); }
.card-tall .app-title { font-size: clamp(1.5rem, 3.4vh, 2.2rem); font-weight: 700; }

.app-card.status-closed { opacity: .74; }
.app-card.status-closed:hover, .app-card.status-closed:focus-within { opacity: .92; }

.closed-tint {
  position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
  background: hsl(0, 0%, 50%);
  mix-blend-mode: saturation;
  opacity: .74;
  transition: opacity 0.32s var(--ease-lux);
}
.app-card.status-closed:hover .closed-tint,
.app-card.status-closed:focus-within .closed-tint { opacity: .48; }

.app-grid:has(.app-card:is(:hover, :focus-visible)) .app-card:not(:hover, :focus-visible) {
  opacity: 0.64;
  border-color: transparent;
}

.app-grid:has(.app-card:is(:hover, :focus-visible)) .app-card.status-closed:not(:hover, :focus-visible) { opacity: 0.5; }

.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.tab-rail {
  position: relative; align-self: center; flex-shrink: 0;
  display: flex; align-items: center; gap: 0.15rem;
  padding: 0.35rem; border-radius: 999px;
  background: light-dark(rgba(255,255,255,0.55), rgba(255,255,255,0.025));
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft), inset 0 1px 1px light-dark(rgba(255,255,255,0.9), rgba(255,255,255,0.05));
  animation: slideDown 0.9s var(--ease-lux) 0.05s both;
  --tab-accent: #7c9bff;
  transition: --tab-accent 0.34s var(--ease-lux);
}

.tab-goo {
  position: absolute; inset: 0; z-index: 0;
  filter: url(#lx-goo); isolation: isolate; pointer-events: none;
  opacity: light-dark(.10, .16);
}

.tab-indicator, .tab-indicator-trail, .tab-indicator-sheen {
  position: absolute; top: 4px; height: calc(100% - 8px);
  border-radius: 999px; width: 60px;
}

.tab-indicator {
  background: light-dark(#141210, #ffffff);
  transform: scaleY(1);
  transition: transform .34s var(--ease-pill);
}
.tab-indicator.is-traveling { transform: scaleY(.86); }
.tab-indicator-sheen.is-traveling { transform: scaleY(.86); }

.tab-indicator-sheen {
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.25);
  pointer-events: none; z-index: 1;
}

.tab-indicator-glow {
  position: absolute; top: 4px; height: calc(100% - 8px);
  border-radius: 999px; width: 60px;
  box-shadow: 0 6px 20px -8px color-mix(in oklab, var(--tab-accent) 45%, transparent);
  transition: box-shadow 0.6s var(--ease-lux);
  pointer-events: none; z-index: -1;
}

.tab-indicator-trail {
  background: light-dark(#141210, #ffffff);
}

@supports (anchor-name: --a) {
  .tab-btn[aria-selected="true"] { anchor-name: --active-tab; }
  .tab-indicator, .tab-indicator-trail, .tab-indicator-glow, .tab-indicator-sheen {
    left: auto; width: auto; transform: none; transform-origin: unset;
    position-anchor: --active-tab;
    inset-inline-start: anchor(--active-tab start);
    inset-inline-end: anchor(--active-tab end);
  }
  .tab-indicator { transition: inset-inline-start 0.34s var(--ease-pill), inset-inline-end 0.46s var(--ease-pill); }
  .tab-indicator-trail { transition: inset-inline-start 0.34s var(--ease-pill) 0.06s, inset-inline-end 0.46s var(--ease-pill) 0.06s; }
  .tab-indicator-glow { transition: inset-inline-start 0.34s var(--ease-pill), inset-inline-end 0.46s var(--ease-pill); }
  .tab-indicator-sheen { transition: inset-inline-start 0.34s var(--ease-pill), inset-inline-end 0.46s var(--ease-pill); }
}
@supports not (anchor-name: --a) {
  .tab-indicator, .tab-indicator-trail, .tab-indicator-glow, .tab-indicator-sheen { left: 0; transform: translateX(0); }
}

.tab-btn {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 0.55rem;
  background: transparent; border: none; color: var(--text-muted);
  padding: 0.65rem 1.35rem; border-radius: 999px;
  font-family: var(--ui-font);
  font-size: 0.92rem; font-weight: 600; white-space: nowrap;
  transition: color 0.5s var(--ease-lux);
}

.tab-btn i { font-size: 0.85rem; transition: color 0.5s var(--ease-lux); }
.tab-btn[aria-selected="true"] { color: var(--text); }
.tab-btn[aria-selected="true"] i { color: var(--tab-accent); }

::view-transition-old(grid) { animation: lx-grid-out 0.26s var(--ease-lux) both; }
::view-transition-new(grid) { animation: lx-grid-in 0.28s var(--ease-lux) both; }

@keyframes lx-grid-out {
  to { transform: translateX(calc(var(--dir, 1) * -18px)); filter: blur(6px); opacity: 0; }
}
@keyframes lx-grid-in {
  from { transform: translateX(calc(var(--dir, 1) * 18px)) scale(0.98); filter: blur(6px); opacity: 0; }
  to { transform: none; filter: blur(0); opacity: 1; }
}

.app-grid.is-out { animation: lx-grid-out 0.22s var(--ease-lux) both; }

::view-transition-group(.tile) { animation-duration: .3s; animation-timing-function: var(--ease-lux); }
::view-transition-old(.tile)   { animation: lx-tile-out .14s var(--ease-lux) both; }
::view-transition-new(.tile)   { animation: lx-tile-in  .22s var(--ease-lux) .05s both; }
@keyframes lx-tile-out { to   { opacity: 0; transform: scale(.97); } }
@keyframes lx-tile-in  { from { opacity: 0; transform: scale(1.02); } }

::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}

#lx-palette {
  width: min(880px, 94vw); max-height: 76vh;
  margin: min(16vh, 150px) auto auto;
  display: flex; flex-direction: column;
  background-color: light-dark(rgba(255,255,255,0.82), rgba(10,11,15,0.82));
  background-image: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 40%);
  backdrop-filter: blur(28px) saturate(150%);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  border: 1px solid var(--border-highlight);
  border-radius: 28px; box-shadow: var(--shadow-deep), inset 0 1px 1px rgba(255,255,255,0.1), inset 0 0 0 1px rgba(255,255,255,0.05), inset 0 1px 0 light-dark(rgba(255,255,255,.9), rgba(255,255,255,.12));
  padding: 0; overflow: hidden; color: var(--text);
  opacity: 0; transform: translateY(-10px) scale(0.97);
  transition: opacity 0.3s var(--ease-spring), transform 0.3s var(--ease-spring), --live-accent 0.45s var(--ease-lux), display 0.3s allow-discrete, overlay 0.3s allow-discrete;
}
#lx-palette:not([open]) { pointer-events: none; }

#lx-palette::before {
  content: ''; position: absolute; inset: 0 0 auto; height: 120px; z-index: -1;
  background: linear-gradient(180deg, color-mix(in oklab, var(--live-accent) 7%, transparent), transparent);
  pointer-events: none;
}

#lx-palette[open] { opacity: 1; transform: none; }

@starting-style {
  #lx-palette[open] { opacity: 0; transform: translateY(-10px) scale(0.97); }
}

#lx-palette::backdrop {
  background:
    radial-gradient(70% 50% at 50% 0%, color-mix(in oklab, var(--live-accent) 10%, transparent), transparent 70%),
    light-dark(rgba(20,18,15,0.32), rgba(2,3,5,0.5));

  -webkit-backdrop-filter: blur(22px);

  transition: opacity 0.12s var(--ease-lux), display 0.3s allow-discrete, overlay 0.3s allow-discrete;
}
#lx-palette[open]::backdrop { opacity: 1; }
@starting-style { #lx-palette[open]::backdrop { opacity: 0; } }

.palette-input-row { display: flex; align-items: center; gap: 1rem; padding: 1.35rem 1.6rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }

.palette-input-wrap { position: relative; flex: 1; display: flex; align-items: center; }

.palette-ghost {

.palette-body { display: flex; flex: 1; min-height: 0; }

.palette-results {

.palette-group-header {

.palette-item {

.palette-item::before {

.palette-detail-header { position: relative; z-index: 1; display: flex; align-items: center; gap: 1rem; animation: detailIn .32s var(--ease-lux) both; }
.palette-detail .app-icon-wrapper {

    0 10px 24px -10px color-mix(in oklab, var(--c1) 45%, transparent),

.palette-actions { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 0.5rem; animation: detailIn .32s var(--ease-lux) .09s both; }
.palette-action {

@media (max-width: 1024px) {
  html, body { height: auto; min-height: 100dvh; overflow-y: auto; overflow-x: hidden; }
  body { display: block; }
  .container { height: auto; min-height: 100dvh; padding-top: 5rem; padding-bottom: 2rem; }
  .app-grid {
    flex: none; display: grid;
    grid-template-columns: repeat(2, 1fr) !important; grid-template-rows: none !important;
    grid-auto-rows: 220px;
  }
  .app-card { grid-column: auto !important; grid-row: auto !important; }

<script>
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.compressor = null;
    this.reverb = null;
    this.reverbHP = null;
    this.rvbSend = null;
    this.enabled = false;
    this.scale = [523.25, 587.33, 659.25, 783.99, 880];
    this._lastTick = 0;
    this._lastHover = 0;
  }

  async _boot() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;

      this.compressor = this.ctx.createDynamicsCompressor();
      this.compressor.threshold.value = -14;
      this.compressor.knee.value = 6;
      this.compressor.ratio.value = 12;
      this.compressor.attack.value = 0.003;
      this.compressor.release.value = 0.18;

      this.master.connect(this.compressor);
      this.compressor.connect(this.ctx.destination);

      const sr = this.ctx.sampleRate;
      const len = sr * 2.5;
      const buf = this.ctx.createBuffer(2, len, sr);

      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5) * Math.exp(-i / sr * 0.6);
        }
      }

      this.reverb = this.ctx.createConvolver();
      this.reverb.buffer = buf;
      this.reverbHP = this.ctx.createBiquadFilter();
      this.reverbHP.type = 'highpass';
      this.reverbHP.frequency.value = 300;
      this.rvbSend = this.ctx.createGain();
      this.rvbSend.gain.value = 0.25;
      this.reverb.connect(this.reverbHP);
      this.reverbHP.connect(this.rvbSend);
      this.rvbSend.connect(this.master);

      document.addEventListener('visibilitychange', () => {
        if (!this.ctx) return;
        if (document.hidden) { this.ctx.suspend(); }
        else if (this.enabled) { this.ctx.resume(); }
      });
    } catch (e) {}
  }

  _v(freq, type, t, dur, vol, freqEnd) {
    if (!this.ctx) return;
    const jitter = 1 + (Math.random() * 2 - 1) * 0.003;
    const f0 = freq * jitter;
    const f1 = freqEnd ? freqEnd * jitter : null;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 0.7;
    filter.frequency.setValueAtTime(2800, t);
    filter.frequency.exponentialRampToValueAtTime(1900, t + dur);

    const env = this.ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + Math.min(0.005, dur * 0.1));
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    filter.connect(env);
    env.connect(this.master);
    if (this.reverb) env.connect(this.reverb);

    [-4, 4].forEach((cents) => {
      const osc = this.ctx.createOscillator();
      osc.type = type || 'sine';
      const ratio = Math.pow(2, cents / 1200);
      osc.frequency.setValueAtTime(f0 * ratio, t);
      if (f1) osc.frequency.exponentialRampToValueAtTime(f1 * ratio, t + dur);
      osc.connect(filter);
      osc.start(t);
      osc.stop(t + dur + 0.1);
    });
  }

  async hover(idx = 0, opts = {}) {
    if (!this.enabled) return;
    await this._boot();
    if (!this.ok()) return;
    const now = this.ctx.currentTime;
    if (opts.throttle !== false) {
      if (now - this._lastHover < 0.07) return;
      this._lastHover = now;
    }
    const octave = opts.octave || 0;
    const velocity = clamp(opts.velocity || 0, 0, 1);
    const g = 1 - velocity * 0.65;
    const f = this.scale[((idx % this.scale.length) + this.scale.length) % this.scale.length] * Math.pow(2, octave);
    this._v(f, 'sine', now, 0.18, 0.02 * g);
    this._v(f * 2, 'sine', now + 0.008, 0.12, 0.005 * g);
  }

  async switchSweep(fromKey, toKey) {
    if (!this.enabled) return;
    await this._boot();
    if (!this.ok()) return;
    const root = (k) => this.scale[((k % this.scale.length) + this.scale.length) % this.scale.length];
    const from = root(fromKey), to = root(toKey);
    const t = this.ctx.currentTime;
    this._v(from, 'sine', t, 0.18, 0.025, to);
    this._v(from * 1.5, 'sine', t, 0.18, 0.015, to * 1.5);
  }

  async click() {
    if (!this.enabled) return;
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this._v(900, 'sine', t, 0.02, 0.03, 300);
    this._v(1046.50, 'sine', t, 0.4, 0.025);
    this._v(1318.51, 'sine', t + 0.02, 0.35, 0.015);
  }

  async tick(idx = 0) {
    if (!this.enabled) return;
    await this._boot();
    if (!this.ok()) return;
    const now = this.ctx.currentTime;
    if (now - this._lastTick < 0.045) return;
    this._lastTick = now;
    const f = this.scale[((idx % this.scale.length) + this.scale.length) % this.scale.length] * 0.5;
    this._v(f, 'sine', now, 0.09, 0.012);
    this._v(f * 3, 'sine', now + 0.004, 0.05, 0.0025);
  }

  _air(t, dur, vol) {
    if (!this.ctx) return;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    const src = this.ctx.createBufferSource();
    src.buffer = buf;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.9;
    filter.frequency.setValueAtTime(700, t);
    filter.frequency.exponentialRampToValueAtTime(2200, t + dur);

    const env = this.ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(filter);
    filter.connect(env);
    env.connect(this.master);
    if (this.reverb) env.connect(this.reverb);

    src.start(t);
    src.stop(t + dur + 0.05);
  }

  async veil(opening) {
    if (!this.enabled) return;
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    const a = opening ? 392 : 587.33;
    const b = opening ? 587.33 : 392;
    this._v(a, 'sine', t, 0.42, 0.016, b);
    this._v(a * 2, 'sine', t + 0.03, 0.3, 0.006, b * 2);
    if (opening) this._air(t, 0.5, 0.02);
  }

  async arpUp() {
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this._v(f, 'sine', t + i * 0.08, 0.25, 0.04 - i * 0.006));
  }

  async chime(toLight) {
    if (!this.enabled) return;
    await this._boot();
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    const ns = toLight ? [392, 493.88, 587.33, 698.46] : [698.46, 587.33, 493.88, 392];
    ns.forEach((f, i) => this._v(f, 'sine', t + i * 0.06, 0.25, 0.03));
  }

  ok() { return this.enabled && this.ctx && this.ctx.state === 'running'; }

  async resume() {
    await this._boot();
    if (this.ctx?.state === 'suspended') await this.ctx.resume();
  }

const Motion = (() => {
  const subs = new Set();
  const STEP = 1 / 120;
  let raf = null, last = 0, acc = 0;

  const tick = (now) => {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n++ < 8) { for (const s of subs) s.fixed?.(STEP); acc -= STEP; }
    const alpha = acc / STEP;
    let alive = false;
    for (const s of subs) { if (s.render?.(now / 1000, alpha) !== false) alive = true; }
    raf = alive && !document.hidden ? requestAnimationFrame(tick) : (raf = null);
  };

  return {
    add(s) { subs.add(s); this.wake(); },
    remove(s) { subs.delete(s); },
    wake() { if (!raf && !document.hidden) { last = performance.now(); acc = 0; raf = requestAnimationFrame(tick); } }
  };
})();

document.addEventListener('visibilitychange', () => { if (!document.hidden) Motion.wake(); });

class Spring {
  constructor(k = 190, c = 24, v = 0) { this.k = k; this.c = c; this.v = v; this.dv = 0; this.to = v; }
  fixed(dt) {
    const a = -this.k * (this.v - this.to) - this.c * this.dv;
    this.dv += a * dt;
    this.v += this.dv * dt;
  }

  snap() { this.v = this.to; this.dv = 0; }
  get settled() { return Math.abs(this.dv) < 1e-3 && Math.abs(this.v - this.to) < 1e-3; }
}

const BentoSolver = (() => {
  const COLS = 12;
  const MAX_ROWS = 4;

  const cadence = (width, k) => {
    const base = Math.floor(width / k);
    const rem = width - base * k;
    const parts = new Array(k).fill(base);
    for (let i = 0; i < rem; i++) parts[i] += 1;
    return parts;
  };

  const maxKForWidth = (width) => Math.max(1, Math.floor(width / 2));

  const distribute = (total, slots) => {
    const base = Math.floor(total / slots);
    const rem = total - base * slots;
    const counts = new Array(slots).fill(base);
    for (let i = 0; i < rem; i++) counts[i] += 1;
    return counts;
  };

  const rowsFor = (n) => {
    if (n <= 2) return 1;
    if (n <= 6) return 2;
    if (n <= 12) return 3;
    return 4;
  };

  const tryCompose = (n, rows) => {
    const useHero = rows >= 2 && n >= 4;
    const heroRows = useHero ? 2 : 0;
    const heroCols = useHero ? 6 : 0;
    const remaining = n - (useHero ? 1 : 0);
    const slots = rows;
    const slotWidths = [];
    for (let i = 0; i < slots; i++) slotWidths.push(i < heroRows ? (COLS - heroCols) : COLS);

    const cap = slotWidths.reduce((s, w) => s + maxKForWidth(w), 0);
    if (remaining > cap) return null;

    const counts = distribute(remaining, slots).map((c) => Math.max(c, 0));
    for (let i = 0; i < slots; i++) counts[i] = Math.min(counts[i], maxKForWidth(slotWidths[i]));
    let assigned = counts.reduce((a, b) => a + b, 0);
    let deficit = remaining - assigned;
    let guard = 0;
    while (deficit > 0 && guard++ < 100) {
      let moved = false;
      for (let i = 0; i < slots; i++) {
        if (deficit <= 0) break;
        if (counts[i] < maxKForWidth(slotWidths[i])) { counts[i]++; deficit--; moved = true; }
      }
      if (!moved) break;
    }
    if (deficit > 0) return null;

    const items = [];
    if (useHero) items.push({ col: heroCols, row: heroRows, rowIndex: 0 });
    for (let i = 0; i < slots; i++) {
      const k = counts[i];
      if (k <= 0) continue;
      const parts = cadence(slotWidths[i], k);
      for (const p of parts) items.push({ col: p, row: 1, rowIndex: i });
    }
    return { rows, items };
  };

  const generate = (n) => {
    if (!Number.isFinite(n) || n <= 0) return null;
    let rows = rowsFor(n);
    let result = tryCompose(n, rows);
    while (!result && rows < MAX_ROWS) { rows++; result = tryCompose(n, rows); }
    return result;
  };

  return { generate, COLS };
})();

const moveVariantIndicatorLegacy = (chipsEl, btn, instant) => {
  const indicator = chipsEl.querySelector('.variant-chip-indicator');
  if (!indicator || !btn) return;
  const p = chipsEl.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const x = b.left - p.left, w = b.width;
  const prevX = chipsEl._lastX ?? x;
  const dx = x - prevX;
  const stretch = Math.min(Math.abs(dx) / Math.max(w, 1), 0.3);

  indicator.style.width = `${w}px`;
  indicator.style.transformOrigin = dx >= 0 ? 'left center' : 'right center';

  if (instant) {
    indicator.style.transition = 'none';
    indicator.style.transform = `translateX(${x}px)`;
  } else {
    indicator.style.transition = 'transform 0.3s var(--ease-lux)';
    indicator.style.transform = `translateX(${x}px) scaleX(${1 + stretch})`;
    clearTimeout(chipsEl._settleTimer);
    chipsEl._settleTimer = setTimeout(() => {
      indicator.style.transition = 'transform 0.25s var(--ease-spring)';
      indicator.style.transform = `translateX(${x}px) scaleX(1)`;
    }, 140);
  }
  chipsEl._lastX = x;
};

const buildContextMenu = () => {
  if (contextMenuEl) return contextMenuEl;
  contextMenuEl = document.createElement('div');
  contextMenuEl.className = 'lx-context-menu';
  contextMenuEl.setAttribute('role', 'menu');
  document.body.appendChild(contextMenuEl);
  document.addEventListener('pointerdown', (e) => {
    if (contextMenuEl.classList.contains('is-open') && !contextMenuEl.contains(e.target)) closeContextMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && contextMenuEl.classList.contains('is-open')) closeContextMenu();
  });
  window.addEventListener('resize', closeContextMenu, { passive: true });
  window.addEventListener('scroll', closeContextMenu, { passive: true, capture: true });
  return contextMenuEl;
};

const openCardContextMenu = (card, clientX, clientY) => {
  const menu = buildContextMenu();

  menu.classList.add('is-open');

  if (y + rect.height + pad > window.innerHeight) y = window.innerHeight - rect.height - pad;

    grid.classList.remove('is-auto-flow');
    grid.style.gridTemplateColumns = '';
    grid.style.gridTemplateRows = '';
    grid.innerHTML = `<div class="grid-empty"><i class="fas fa-box-open" aria-hidden="true"></i><span>${escapeHtml(t('emptyCategory'))}</span></div>`;
    pointerFieldDirty = true;
    return;
  }

  const n = cat.apps.length;
  const curated = LAYOUTS[n];
  const generated = curated ? null : BentoSolver.generate(n);

  grid.classList.toggle('is-auto-flow', !curated && !generated);

  if (curated) {
    grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
    grid.style.gridTemplateRows = 'repeat(3, 1fr)';
  } else if (generated) {
    grid.style.gridTemplateColumns = `repeat(${BentoSolver.COLS}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${generated.rows}, 1fr)`;
  } else {
    grid.style.gridTemplateColumns = '';
    grid.style.gridTemplateRows = '';
  }

  const frag = document.createDocumentFragment();
  cat.apps.forEach((app, i) => {
    let placement = null;
    if (curated) {
      const track = curated[i];
      placement = { type: 'explicit', col: track[0], row: track[1] };
    } else if (generated) {
      const item = generated.items[i];
      placement = { type: 'span', col: item.col, row: item.row, rowIndex: item.rowIndex };
    }
    const card = createCard(app, i, placement, cat);
    if (!curated && !generated && i === 0) card.classList.add('card-wide');
    frag.appendChild(card);
  });
  grid.innerHTML = '';
  grid.appendChild(frag);
  pointerFieldDirty = true;
  if (grid.classList.contains('is-auto-flow')) {
    grid.classList.toggle('has-overflow', grid.scrollHeight - grid.clientHeight > 4);
  }

  const origin = lastInteractionPoint ?? railCenter();
  const cards = [...grid.children];
  const skipEntryAnim = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let max = 1;
  const dists = cards.map(c => {
    const r = c.getBoundingClientRect();
    const dist = Math.hypot(r.left + r.width / 2 - origin.x, r.top + r.height / 2 - origin.y);
    max = Math.max(max, dist);
    return dist;
  });
  cards.forEach((c, i) => {
    const scrollDriven = supportsViewTimeline && isNarrowViewport();
    c.style.animationDelay = scrollDriven
      ? `0s, calc(0.95s + var(--i, ${i}) * 0.29s)`
      : `${Math.round((dists[i] / max) * 220)}ms, calc(0.95s + var(--i, ${i}) * 0.29s)`;
    if (!skipEntryAnim) {
      c.style.willChange = 'transform, opacity';
      c.addEventListener('animationend', () => { c.style.willChange = ''; }, { once: true });
    }
  });
};

const initPointerField = () => {
  const grid = document.getElementById('appGrid');
  const container = document.querySelector('.container');
  const spot = document.getElementById('spotlight');
  if (!grid || !container) return;
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  let REVEAL_RADIUS = Math.max(150, Math.min(260, window.innerWidth * 0.22));
  let cards = [];
  let px = -9999, py = -9999;
  let sx = -9999, sy = -9999;
  let hasPointer = false;
  let lastMove = 0;

  const reducedMotionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  const measure = () => {
    cards = Array.from(grid.querySelectorAll('.app-card'));
    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      c._r = { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
      if (!c._springs) {

        c._springs = {
          tx: new Spring(200, 20, 0),
          ty: new Spring(200, 20, 0),
          tz: new Spring(180, 21, 0),
          reveal: new Spring(90, 19, 0)
        };
      }
      if (!c._last) c._last = {};
    });
    pointerFieldDirty = false;
  };

  const setIfChanged = (c, key, val, eps, unit) => {
    const prev = c._last[key];
    if (prev !== undefined && Math.abs(prev - val) < eps) return;
    c._last[key] = val;
    c.style.setProperty(key, unit ? `${val}${unit}` : String(val));
  };

  const subscriber = {
    fixed(dt) {
      pointerVX *= Math.exp(-dt / 0.14);
      if (pointerFieldDirty) measure();
      const wantsTilt = !reducedMotionMQ.matches;

      cards.forEach(c => {
        const r = c._r;
        const s = c._springs;
        if (!r || !s) return;

        const dx = px < r.left ? r.left - px : px > r.right ? px - r.right : 0;
        const dy = py < r.top ? r.top - py : py > r.bottom ? py - r.bottom : 0;
        const d = Math.hypot(dx, dy);
        let o = d >= REVEAL_RADIUS ? 0 : 1 - d / REVEAL_RADIUS;
        o *= o;
        s.reveal.to = o * 0.9;

        const inside = px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
        if (inside && wantsTilt) {
          const nx = (px - r.left - (r.right - r.left) / 2) / ((r.right - r.left) / 2);
          const ny = (py - r.top - (r.bottom - r.top) / 2) / ((r.bottom - r.top) / 2);
          const lean = clamp(pointerVX * 0.0006, -0.25, 0.25);
          s.tx.to = nx + lean;
          s.ty.to = ny;
          s.tz.to = 14;
        } else {
          s.tx.to = 0; s.ty.to = 0; s.tz.to = 0;
        }

        if (wantsTilt) {
          s.tx.fixed(dt); s.ty.fixed(dt); s.tz.fixed(dt); s.reveal.fixed(dt);
        } else {

          s.tx.snap(); s.ty.snap(); s.tz.snap(); s.reveal.snap();
        }
      });

      if (hasPointer) {
        const k = 1 - Math.exp(-dt / 0.09);
        sx += (px - sx) * k;
        sy += (py - sy) * k;
      } else {
        sx = px; sy = py;
      }
    },

    render() {
      let alive = false;

      cards.forEach(c => {
        const r = c._r;
        const s = c._springs;
        if (!r || !s) return;

        setIfChanged(c, '--reveal-o', s.reveal.v, 0.001);
        if (s.reveal.v > 0.002 || s.reveal.to > 0) {
          setIfChanged(c, '--rx', px - r.left, 0.5, 'px');
          setIfChanged(c, '--ry', py - r.top, 0.5, 'px');
        } else if ('--rx' in c._last) {
          c.style.removeProperty('--rx');
          c.style.removeProperty('--ry');
          delete c._last['--rx'];
          delete c._last['--ry'];
        }
        setIfChanged(c, '--tx', s.tx.v, 0.001);
        setIfChanged(c, '--ty', s.ty.v, 0.001);

        const inside = px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
        if (inside) {
          c.classList.add('is-tracking');
          setIfChanged(c, '--mx', px - r.left, 0.5, 'px');
          setIfChanged(c, '--my', py - r.top, 0.5, 'px');
        } else if (c.classList.contains('is-tracking')) {
          c.classList.remove('is-tracking');
          c.style.removeProperty('--mx');
          c.style.removeProperty('--my');
          delete c._last['--mx']; delete c._last['--my'];
        }

        if (inside || !s.tz.settled) {
          setIfChanged(c, '--tz', s.tz.v, 0.5, 'px');
        } else if ('--tz' in c._last) {
          c.style.removeProperty('--tz');
          delete c._last['--tz'];
        }

        const settled = s.tx.settled && s.ty.settled && s.tz.settled && s.reveal.settled;
        const active = inside || s.reveal.to > 0 || !settled;
        if (active && !c._wc) { c.style.willChange = 'transform'; c._wc = true; }
        else if (!active && c._wc) { c.style.willChange = ''; c._wc = false; }

        if (!settled) alive = true;
      });

      if (spot) {
        if (hasPointer) {
          const idle = performance.now() - lastMove > 2200;
          spot.style.setProperty('--sx', `${sx.toFixed(1)}px`);
          spot.style.setProperty('--sy', `${sy.toFixed(1)}px`);
          spot.classList.add('is-active');
          spot.classList.toggle('is-idle', idle);
          if (!idle || Math.abs(px - sx) > 0.1 || Math.abs(py - sy) > 0.1) alive = true;
        } else {
          spot.classList.remove('is-active', 'is-idle');
        }
      }

      return alive;
    }
  };

  document.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const now = performance.now();
    if (!hasPointer) {
      px = e.clientX; py = e.clientY;
      sx = px; sy = py;
      pointerVX = 0;
      hasPointer = true;
      lastMove = now;
      Motion.wake();
      return;
    }
    const dt = Math.max((now - lastMove) / 1000, 1 / 240);
    const rawVx = clamp((e.clientX - px) / dt, -4000, 4000);
    pointerVX += (rawVx - pointerVX) * (1 - Math.exp(-dt / 0.05));
    px = e.clientX; py = e.clientY;
    lastMove = now;
    Motion.wake();
  }, { passive: true });

  document.addEventListener('pointerleave', () => {
    px = -9999; py = -9999;
    hasPointer = false;
    Motion.wake();
  });

  window.addEventListener('blur', () => {
    px = -9999; py = -9999;
    hasPointer = false;
    Motion.wake();
  });

  document.addEventListener('pointerout', (e) => {
    if (e.relatedTarget === null) {
      px = -9999; py = -9999;
      hasPointer = false;
      Motion.wake();
    }
  });

  window.addEventListener('resize', () => { REVEAL_RADIUS = Math.max(150, Math.min(260, window.innerWidth * 0.22)); pointerFieldDirty = true; Motion.wake(); }, { passive: true });
  window.addEventListener('scroll', () => { pointerFieldDirty = true; Motion.wake(); }, { passive: true, capture: true });

  measure();
  Motion.add(subscriber);
};

const initMagneticControls = () => {
  const pill = document.querySelector('.controls-pill');
  if (!pill) return;
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const FIELD = 40, MAX_PULL = 6;
  let buttons = [];
  let px = -9999, py = -9999;
  let dirty = true;

  const measure = () => {
    buttons = Array.from(pill.querySelectorAll('button')).map(btn => {
      if (!btn._mag) {
        btn._mag = { x: new Spring(260, 22, 0), y: new Spring(260, 22, 0), s: new Spring(260, 22, 1) };
        btn.addEventListener('pointerenter', () => { btn._mag.s.to = 1.06; Motion.wake(); });
        btn.addEventListener('pointerleave', () => { btn._mag.s.to = 1; Motion.wake(); });
      }
      const r = btn.getBoundingClientRect();
      return { btn, cx: r.left + r.width / 2, cy: r.top + r.height / 2, m: btn._mag };
    });
    dirty = false;
  };

  const subscriber = {
    fixed(dt) {
      if (dirty) measure();
      buttons.forEach(({ cx, cy, m }) => {
        const d = Math.hypot(px - cx, py - cy);
        if (d < FIELD) {
          const pull = (1 - d / FIELD) * MAX_PULL;
          const ang = Math.atan2(py - cy, px - cx);
          m.x.to = Math.cos(ang) * pull;
          m.y.to = Math.sin(ang) * pull;
        } else {
          m.x.to = 0; m.y.to = 0;
        }
        m.x.fixed(dt); m.y.fixed(dt); m.s.fixed(dt);
      });
    },
    render() {
      let alive = false;
      buttons.forEach(({ btn, m }) => {
        btn.style.transform = `translate(${m.x.v.toFixed(2)}px, ${m.y.v.toFixed(2)}px) scale(${m.s.v.toFixed(3)})`;
        if (!m.x.settled || !m.y.settled || !m.s.settled) alive = true;
      });
      return alive;
    }
  };

  window.addEventListener('resize', () => { dirty = true; Motion.wake(); }, { passive: true });
  window.addEventListener('scroll', () => { dirty = true; }, { passive: true, capture: true });
  document.addEventListener('pointermove', (e) => {
    const r = pill.getBoundingClientRect();
    const inField = e.clientX >= r.left - FIELD && e.clientX <= r.right + FIELD &&
                    e.clientY >= r.top - FIELD && e.clientY <= r.bottom + FIELD;
    if (inField) { px = e.clientX; py = e.clientY; Motion.wake(); }
    else if (px !== -9999) { px = -9999; py = -9999; Motion.wake(); }
  }, { passive: true });

  pill.classList.add('is-magnetic');
  measure();
  Motion.add(subscriber);
};

let isLightTheme = false;

const hueFromHex = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 220;
  const h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? ((b - r) / d + 2) : ((r - g) / d + 4);
  return h * 60;
};

const hexBlend = (hex, mix, ratio) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const r = Math.round(((n >> 16) & 255) + (mix[0] - ((n >> 16) & 255)) * ratio);
  const g = Math.round(((n >> 8) & 255) + (mix[1] - ((n >> 8) & 255)) * ratio);
  const b = Math.round((n & 255) + (mix[2] - (n & 255)) * ratio);
  return `#${[r, g, b].map(v => v.toString(16).padStart(2, '0')).join('')}`;
};

const updateFavicon = (cat) => {
  const accent = (cat && cat.accent) || '#7c9bff';
  const light = hexBlend(accent, [255, 255, 255], 0.45);
  const dark = hexBlend(accent, [0, 0, 0], 0.55);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light}"/><stop offset="0.55" stop-color="${accent}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs><rect x="1" y="1" width="62" height="62" rx="16" fill="url(#g)"/><rect x="20" y="30" width="18" height="18" rx="3" fill="none" stroke="#fff" stroke-width="4"/><path d="M27 37 L44 20 M44 20 L34 20 M44 20 L44 30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const link = document.querySelector('link[rel="icon"]');
  if (link) link.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
};

class OrbField {
  constructor(canvas) {
    this.cv = canvas;
    this.cx = canvas.getContext('2d');
    this.t = 0;
    this.orbs = [];
    this.idleScale = 1;
    this.frameCount = 0;
    this.bloomStart = performance.now();
    this.lastActive = performance.now();
    this.resize();
    this.spawn();

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      Motion.add(this);
    } else {
      this.bloomStart = 0;
      this.render();
    }
  }

  resize() {
    const oldW = this.cv.width, oldH = this.cv.height;
    const scale = 0.4;
    const dpr = 1;
    this.cv.width = Math.round(window.innerWidth * scale * dpr);
    this.cv.height = Math.round(window.innerHeight * scale * dpr);
    this.cv.style.width = '100%';
    this.cv.style.height = '100%';
    if (oldW && oldH && this.orbs.length) {
      const rx = this.cv.width / oldW, ry = this.cv.height / oldH;
      this.orbs.forEach(o => {
        o.ax *= rx; o.ay *= ry;
        o.orbitR *= (rx + ry) / 2;
      });
    }
    this.lastActive = performance.now();
    Motion.wake();
  }

  spawn() {
    const n = window.innerWidth < 768 ? 4 : 6;
    const palette = isLightTheme ? [205, 225, 195] : [222, 258, 195];
    const minSide = Math.min(this.cv.width, this.cv.height);
    this.orbs = Array.from({ length: n }, (_, i) => {
      const hue = palette[i % 3];
      const ang = i * 2.399;
      const rad = 0.34 * minSide * Math.sqrt(i / n);
      const ax = this.cv.width / 2 + Math.cos(ang) * rad;
      const ay = this.cv.height / 2 + Math.sin(ang) * rad;
      return {
        ax, ay,
        x: ax, y: ay,
        orbitR: minSide * (0.06 + Math.random() * 0.03),
        orbitSpeed: 0.15 + Math.random() * 0.1,
        r: Math.random() * 160 + 120,
        hue,
        hueSpring: new Spring(40, 14, hue),
        phase: Math.random() * Math.PI * 2
      };
    });
  }

  retarget() {
    const palette = isLightTheme ? [205, 225, 195] : [222, 258, 195];
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.orbs.forEach((o, i) => {
      o.hueSpring.to = palette[i % 3];
      if (reduced) { o.hueSpring.snap(); o.hue = o.hueSpring.v; }
    });
    this.lastActive = performance.now();
    if (reduced) this.render(performance.now());
    else Motion.wake();
  }

  retargetCategory(hex, impulseDir = 0) {
    const hue = hueFromHex(hex);
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.orbs.forEach((o, i) => {
      o.hueSpring.to = (hue + (i - (this.orbs.length - 1) / 2) * 22 + 360) % 360;
      if (reduced) { o.hueSpring.snap(); o.hue = o.hueSpring.v; }
      else if (impulseDir) o.hueSpring.dv += impulseDir * (i % 2 ? 26 : -26);
    });
    this.lastActive = performance.now();
    if (reduced) this.render(performance.now());
    else Motion.wake();
  }

  fixed(dt) {
    const idleFor = performance.now() - this.lastActive;
    const idleTarget = idleFor > 20000 ? 0 : 1;
    this.idleScale += (idleTarget - this.idleScale) * Math.min(dt * 1.5, 1);
    if (this.idleScale < 0.0005) this.idleScale = 0;
    const scaledDt = dt * this.idleScale;
    this.t += scaledDt * 0.06;
    this.orbs.forEach(o => {
      o.hueSpring.fixed(scaledDt);
      o.hue = o.hueSpring.v;
      const ang = this.t * o.orbitSpeed + o.phase;
      o.x = o.ax + Math.cos(ang) * o.orbitR;
      o.y = o.ay + Math.sin(ang) * o.orbitR;
    });
  }

  render(now) {
    if (document.hidden) return true;

    const idleFor = performance.now() - this.lastActive;
    if (idleFor > 20000 && this.idleScale === 0) return false;

    const minInterval = idleFor > 20000 ? 1 / 12 : 1 / 30;
    if (this._lastDraw && now - this._lastDraw < minInterval) return true;
    this._lastDraw = now;

    this.cx.clearRect(0, 0, this.cv.width, this.cv.height);
    this.cx.globalCompositeOperation = isLightTheme ? 'multiply' : 'screen';
    const bloom = Math.max(0, 1 - (performance.now() - this.bloomStart) / 7000) * 0.15;

    this.orbs.forEach(o => {
      const rr = o.r * (1 + bloom);
      const g = this.cx.createRadialGradient(o.x, o.y, 0, o.x, o.y, rr);
      const a = (isLightTheme ? 0.07 : 0.1) * (1 + bloom);
      g.addColorStop(0, `hsla(${o.hue}, 78%, ${isLightTheme ? 60 : 40}%, ${a})`);
      g.addColorStop(0.4, `hsla(${o.hue}, 68%, ${isLightTheme ? 70 : 30}%, ${a * 0.4})`);
      g.addColorStop(1, 'transparent');

      this.cx.fillStyle = g;
      this.cx.beginPath();
      this.cx.arc(o.x, o.y, rr, 0, Math.PI * 2);
      this.cx.fill();
    });

    return true;
  }
}

const getStoredTheme = () => {
  try { return localStorage.getItem('lx-theme'); } catch (e) { return null; }
};

const getStoredSound = () => {
  try { return localStorage.getItem('lx-sound'); } catch (e) { return null; }
};

const applyStoredSoundPref = () => {
  if (getStoredSound() !== '1') return;
  sfx.enabled = true;
  const btn = document.getElementById('soundToggle');
  if (!btn) return;
  btn.setAttribute('aria-pressed', 'true');
  btn.querySelector('i').className = 'fas fa-volume-up';
  updateSoundButtonLabel();
};

const applyTheme = (explicit) => {
  const stored = explicit !== undefined ? explicit : getStoredTheme();
  const isLight = stored === 'light' || stored === 'dark'
    ? stored === 'light'
    : window.matchMedia('(prefers-color-scheme: light)').matches;

  document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
  isLightTheme = isLight;

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f3f1ec' : '#050608');

  if (explicit !== undefined) {
    try { localStorage.setItem('lx-theme', explicit); } catch (e) {}
  }

  const btn = document.getElementById('themeToggle');
  btn.setAttribute('aria-pressed', String(isLight));
  btn.setAttribute('aria-label', isLight ? t('themeToDark') : t('themeToLight'));
  btn.querySelector('i').className = `fas ${isLight ? 'fa-moon' : 'fa-sun'}`;

  if (window.bgAnim) {
    window.bgAnim.retarget();
    const activeCat = categories.find(c => c.id === currentTabId);
    if (activeCat) window.bgAnim.retargetCategory(activeCat.accent);
  }
};

const updateThemeButtonLabel = () => {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  btn.setAttribute('aria-label', isLightTheme ? t('themeToDark') : t('themeToLight'));
};

const updateSoundButtonLabel = () => {
  const btn = document.getElementById('soundToggle');
  if (!btn) return;
  btn.setAttribute('aria-label', sfx.enabled ? t('soundMute') : t('soundEnable'));
};

const updateLangButtonLabel = () => {
  const btn = document.getElementById('langToggle');
  if (!btn) return;
  btn.setAttribute('aria-pressed', String(lang === 'en'));
  const label = lang === 'ar' ? t('langSwitchToEn') : t('langSwitchToAr');
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
};

const sweepStaticStrings = () => {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.dataset.i18nTitle)); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder)); });
  const paletteToggle = document.getElementById('paletteToggle');
  if (paletteToggle) paletteToggle.setAttribute('title', `${t('quickSearch')} (Ctrl/Cmd+K)`);
};

const applyI18n = (opts = {}) => {
  const { rebuild = true } = opts;

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelector('meta[name="description"]')?.setAttribute('content', t('metaDescription'));
  applyManifest();
  sweepStaticStrings();
  updateSoundButtonLabel();
  updateThemeButtonLabel();
  updateLangButtonLabel();

  if (!rebuild) return;

  const preservedTab = currentTabId;
  buildTabRail();
  if (preservedTab) {
    setActiveButtonStates(preservedTab);

const withViewTransition = (fn) => {
  if (activeViewTransition) { try { activeViewTransition.skipTransition(); } catch (e) {} }

const TILE_STAGGER_COUNT = 12;
const TILE_STAGGER_STEP_MS = 10;
let tileStaggerStyleEl = null;

const setTileStagger = (dir) => {
  if (!tileStaggerStyleEl) {
    tileStaggerStyleEl = document.createElement('style');
    document.head.appendChild(tileStaggerStyleEl);
  }
  const forward = dir >= 0;
  let css = '';
  for (let i = 0; i < TILE_STAGGER_COUNT; i++) {
    const order = forward ? i : (TILE_STAGGER_COUNT - 1 - i);
    css += `::view-transition-group(tile-${i}) { animation-delay: ${order * TILE_STAGGER_STEP_MS}ms; }\n`;
  }
  tileStaggerStyleEl.textContent = css;
};

const clearTileStagger = () => {

const moveIndicatorLegacy = (btn, instant) => {
  const rail = document.getElementById('tabRail');
  const ind = document.getElementById('tabIndicator');
  const trail = document.getElementById('tabIndicatorTrail');
  const glow = document.getElementById('tabIndicatorGlow');
  const sheen = document.getElementById('tabIndicatorSheen');
  if (!rail || !ind || !trail || !btn) return;

  const p = rail.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const x = b.left - p.left, w = b.width;
  const dx = x - lastX;
  const stretch = Math.min(Math.abs(dx) / Math.max(w, 1), 0.55);

  clearTimeout(indicatorTimer);

  ind.style.width = `${w}px`;
  trail.style.width = `${w}px`;
  ind.style.transformOrigin = dx >= 0 ? 'left center' : 'right center';
  if (glow) glow.style.width = `${w}px`;
  if (sheen) { sheen.style.width = `${w}px`; sheen.style.transformOrigin = ind.style.transformOrigin; }

  if (instant) {
    ind.style.transition = 'none';
    ind.style.transform = `translateX(${x}px)`;
    trail.style.transition = 'none';
    trail.style.transform = `translateX(${x}px)`;
    if (glow) { glow.style.transition = 'none'; glow.style.transform = `translateX(${x}px)`; }
    if (sheen) { sheen.style.transition = 'none'; sheen.style.transform = `translateX(${x}px)`; }
  } else {
    ind.style.transition = 'transform 0.42s var(--ease-lux)';
    ind.style.transform = `translateX(${x}px) scaleX(${1 + stretch}) scaleY(${1 - stretch * 0.35})`;
    trail.style.transition = 'transform 0.5s var(--ease-spring) 0.06s, width 0.5s var(--ease-spring) 0.06s';
    trail.style.transform = `translateX(${x}px)`;
    if (glow) { glow.style.transition = 'transform 0.42s var(--ease-lux)'; glow.style.transform = `translateX(${x}px)`; }
    if (sheen) {
      sheen.style.transition = 'transform 0.42s var(--ease-lux)';
      sheen.style.transform = `translateX(${x}px) scaleX(${1 + stretch}) scaleY(${1 - stretch * 0.35})`;
    }
    indicatorTimer = setTimeout(() => {
      ind.style.transition = 'transform 0.5s var(--ease-spring)';
      ind.style.transform = `translateX(${x}px) scaleX(1) scaleY(1)`;
      if (sheen) {
        sheen.style.transition = 'transform 0.5s var(--ease-spring)';
        sheen.style.transform = `translateX(${x}px) scaleX(1) scaleY(1)`;
      }
    }, 190);
  }
  lastX = x;
};

const activateTab = (id, opts = {}) => {
  const { pushHash = true, playSound = true, instant = false } = opts;
  if (!categories.some(c => c.id === id)) return Promise.resolve();
  const prevId = currentTabId;
  const dir = prevId ? (catIndex(id) > catIndex(prevId) ? 1 : -1) : 1;
  currentTabId = id;

  const cat = categories.find(c => c.id === id);

  setActiveButtonStates(id);
  const activeBtn = document.getElementById(`tab-${id}`);
  applyTabAccent(cat, prevId && prevId !== id ? dir : 0);
  if (!supportsAnchor) moveIndicatorLegacy(activeBtn, instant);

  if (!instant && prevId && prevId !== id) {
    const tabLive = document.getElementById('tabLive');
    if (tabLive) tabLive.textContent = loc(cat.label);
  }
  if (!instant && prevId && prevId !== id) {

    const ind = document.getElementById('tabIndicator');
    const sheen = document.getElementById('tabIndicatorSheen');
    if (ind) {
      ind.classList.add('is-traveling');
      clearTimeout(ind._travelTimer);
      ind._travelTimer = setTimeout(() => ind.classList.remove('is-traveling'), 340);
    }
    if (sheen) {
      sheen.classList.add('is-traveling');
      clearTimeout(sheen._travelTimer);
      sheen._travelTimer = setTimeout(() => sheen.classList.remove('is-traveling'), 340);
    }
  }

  const g = document.getElementById('appGrid');
  g.setAttribute('aria-labelledby', `tab-${id}`);

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rtl = document.documentElement.dir === 'rtl';
  document.documentElement.style.setProperty('--dir', String(dir * (rtl ? 1 : -1)));

  const run = () => renderCards(g, id);

  let rendered;
  if (instant || reducedMotion) {
    run();
    rendered = Promise.resolve();
  } else if (document.startViewTransition && supportsTileTransitions) {

    setTileStagger(dir * (rtl ? 1 : -1));
    nameTiles(g, true);
    const vt = withViewTransition(() => { run(); nameTiles(g, true); });
    rendered = vt.finished.catch(() => {}).finally(() => { if (activeViewTransition === vt) { activeViewTransition = null; nameTiles(g, false); clearTileStagger(); } });
  } else if (document.startViewTransition) {

    g.style.viewTransitionName = 'grid';
    const vt = withViewTransition(run);
    rendered = vt.finished.catch(() => {}).finally(() => { if (activeViewTransition === vt) { activeViewTransition = null; g.style.viewTransitionName = ''; } });
  } else {
    g.classList.add('is-out');
    rendered = new Promise((resolve) => {
      setTimeout(() => { run(); g.classList.remove('is-out'); resolve(); }, 220);
    });
  }

  try { localStorage.setItem('lx-last-tab', id); } catch (e) {}
  if (pushHash && location.hash.replace('#', '') !== id) location.hash = id;

  if (playSound && prevId && prevId !== id) {
    const prevCat = categories.find(c => c.id === prevId);
    if (prevCat) sfx.switchSweep(prevCat.key, cat.key);
  }

  return rendered;
};

const normalizeAr = (s) => s.toLowerCase()
  .replace(/[\u200c\u200f\u202b\u202c]/g, '')
  .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي')
  .replace(/[ةه]/g, 'ه').replace(/[ؤئ]/g, 'ء')
  .replace(/\s+/g, ' ').trim();

const normMap = (s) => {
  let out = '', map = [];
  for (let i = 0; i < s.length; i++) {
    let c = s[i].toLowerCase();
    if (/[\u064B-\u0652\u0670\u0640]/.test(c)) continue;
    c = c.replace(/[أإآٱ]/, 'ا').replace(/ى/, 'ي').replace(/[ةه]/, 'ه').replace(/[ؤئ]/, 'ء');
    out += c; map.push(i);
  }
  return { out, map };
};

const highlightTitle = (title, query) => {
  const nq = normalizeAr(query);
  if (!nq) return escapeHtml(title);
  const { out, map } = normMap(title);
  const hits = new Set();

  const i = out.indexOf(nq);
  if (i >= 0) {
    for (let k = i; k < i + nq.length; k++) hits.add(map[k]);
  } else {
    let qi = 0;
    for (let k = 0; k < out.length && qi < nq.length; k++) {
      if (out[k] === nq[qi]) { hits.add(map[k]); qi++; }
    }
    if (qi < nq.length) return escapeHtml(title);
  }

  let out2 = '';
  let i2 = 0;
  while (i2 < title.length) {
    if (hits.has(i2)) {
      let j = i2;
      while (j < title.length && hits.has(j)) j++;
      out2 += `<mark>${escapeHtml(title.slice(i2, j))}</mark>`;
      i2 = j;
    } else {
      let j = i2;
      while (j < title.length && !hits.has(j)) j++;
      out2 += escapeHtml(title.slice(i2, j));
      i2 = j;
    }
  }
  return out2;
};

const fuzzyScore = (query, target) => {
  const t = normalizeAr(target), q = normalizeAr(query);
  if (!q) return 0;
  const i = t.indexOf(q);
  if (i === 0) return 1000;
  if (i > 0 && t[i - 1] === ' ') return 850;
  if (i > 0) return 700 - i;
  let qi = 0, run = 0, s = 0;
  for (let k = 0; k < t.length && qi < q.length; k++) {
    if (t[k] === q[qi]) { qi++; run++; s += 4 + run * 3; } else run = 0;
  }
  return qi === q.length ? s : -1;
};

const HIDDEN_CAT = { id: '_secret', label: { ar: 'مخفي', en: 'Hidden' } };

const allPaletteEntries = () => {
  const normal = categories.flatMap(cat => cat.apps.flatMap(app => {
    if (app.variants) {
      return app.variants.map((v, i) => ({
        app: {
          id: `${app.id}::${v.id}`,
          title: { ar: `${app.title.ar} · ${v.label.ar}`, en: `${app.title.en} · ${v.label.en}` },
          url: v.url,

        },
        cat
      }));

  }));

  return normal.concat(unlocked);

const RECENTS_KEY = 'lx-recents';
const RECENTS_CAP = 8;
const FREQ_KEY = 'lx-freq';
const FREQ_CAP = 10;

const getRecentIds = () => {
  try {
    const stored = JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]');
    return Array.isArray(stored) ? stored : [];
  } catch (e) { return []; }
};

const pushRecent = (id) => {
  try {
    const list = getRecentIds().filter(x => x !== id);
    list.unshift(id);
    localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0, RECENTS_CAP)));
  } catch (e) {}
};

const getFreqMap = () => {
  try {
    const stored = JSON.parse(localStorage.getItem(FREQ_KEY) || '{}');
    return stored && typeof stored === 'object' ? stored : {};
  } catch (e) { return {}; }
};

const bumpFreq = (id) => {
  try {
    const map = getFreqMap();
    map[id] = (map[id] || 0) + 1;
    localStorage.setItem(FREQ_KEY, JSON.stringify(map));
  } catch (e) {}
};

const getRecentEntries = (allEntries, limit) => {
  const ids = getRecentIds();
  const freq = getFreqMap();
  const byId = new Map();
  allEntries.forEach(e => { if (!byId.has(e.app.id)) byId.set(e.app.id, e); });

  const candidateIds = new Set([...ids, ...Object.keys(freq)]);
  const scored = [];
  candidateIds.forEach(id => {
    const e = byId.get(id);
    if (!e) return;
    const pos = ids.indexOf(id);
    const recencyScore = pos === -1 ? 0 : (RECENTS_CAP - pos) / RECENTS_CAP;
    const freqScore = Math.min(freq[id] || 0, FREQ_CAP) / FREQ_CAP;
    scored.push({ entry: e, score: recencyScore * 0.6 + freqScore * 0.4 });
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit).map(s => s.entry);
};

const scoreEntry = (query, entry) => {
  const titleArScore = fuzzyScore(query, entry.app.title.ar);
  const titleEnScore = fuzzyScore(query, entry.app.title.en);
  const catScore = fuzzyScore(query, loc(entry.cat.label));
  let hostScore = -1;
  try { hostScore = fuzzyScore(query, new URL(entry.app.url).hostname) * 0.4; } catch (e) {}
  return Math.max(titleArScore, titleEnScore, catScore, hostScore);
};

const paletteItemHtml = (e, globalIndex, query) => `
  <li class="palette-item${globalIndex === 0 ? ' is-active' : ''}" role="option" id="palette-item-${globalIndex}" aria-selected="${globalIndex === 0}" data-index="${globalIndex}" style="${gradVars(e.app.gradient)}--n:${globalIndex};">

    </div>

    </div>
  </li>`;

const renderPaletteResults = (query) => {
  const paletteResults = document.getElementById('paletteResults');
  const allEntries = allPaletteEntries();
  const scored = allEntries
    .map(e => ({ app: e.app, cat: e.cat, score: scoreEntry(query, e) }))
    .filter(e => e.score >= 0)
    .sort((a, b) => b.score - a.score);

  let html = '';

  if (!query && !scored.length) {
    paletteItems = [];
  } else if (!query) {
    paletteTryPicks = null;
    const recents = getRecentEntries(allEntries, 5);
    const recentIds = new Set(recents.map(e => e.app.id));
    const rest = scored.filter(e => !recentIds.has(e.app.id));
    paletteItems = [...recents, ...rest];
    if (recents.length) {
      html += `<li class="palette-group-header" role="presentation">${escapeHtml(t('recentGroup'))}</li>`;
      recents.forEach((e, i) => { html += paletteItemHtml(e, i, query); });
      html += `<li class="palette-group-header" role="presentation">${escapeHtml(t('allGroup'))}</li>`;
      rest.forEach((e, i) => { html += paletteItemHtml(e, recents.length + i, query); });
    } else {
      rest.forEach((e, i) => { html += paletteItemHtml(e, i, query); });
    }
  } else if (scored.length) {
    paletteTryPicks = null;
    paletteItems = scored;
    scored.forEach((e, i) => { html += paletteItemHtml(e, i, query); });
  } else {
    if (!paletteTryPicks) {
      const pool = allEntries.filter(e => e.cat.id !== '_secret');
      const picks = [];
      const used = new Set();
      while (picks.length < Math.min(3, pool.length)) {
        const idx = Math.floor(Math.random() * pool.length);
        if (used.has(idx)) continue;
        used.add(idx);
        picks.push(pool[idx]);
      }
      paletteTryPicks = picks;
    }
    paletteItems = paletteTryPicks;
    html += `<li class="palette-group-header" role="presentation">${escapeHtml(t('tryGroup'))}</li>`;
    paletteTryPicks.forEach((e, i) => { html += paletteItemHtml(e, i, ''); });
  }

  paletteActiveIndex = paletteItems.length ? 0 : -1;
  paletteActionIndex = 0;
  paletteZone = 'list';

  paletteResults.classList.toggle('entrance-armed', paletteEntranceArmed);
  paletteEntranceArmed = false;

  paletteResults.innerHTML = html || `<li class="palette-empty">${escapeHtml(t('noResults'))}</li>`;

  paletteResults.querySelectorAll('.palette-item').forEach(li => {
    li.addEventListener('mouseenter', () => {
      const idx = Number(li.dataset.index);
      if (idx !== paletteActiveIndex) sfx.tick(idx);
      setPaletteActive(idx);
    });
    li.addEventListener('click', () => openPaletteItem(Number(li.dataset.index)));
  });

  updateActiveDescendant();
  updateLiveAccent();
  renderPaletteDetail();
  updatePaletteGhost(query);
  updatePaletteStatus(query, scored.length);
};
