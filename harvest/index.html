<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'">
<title>Harvest</title>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var theme = q.get('theme');
  var lang = q.get('lang');
  try {
    theme = theme || localStorage.getItem('lx-theme');
    lang = lang || localStorage.getItem('lx-lang');
  } catch (e) {}
  var light = theme === 'light' || (theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
  var ar = lang === 'ar';
  var root = document.documentElement;
  root.dataset.theme = light ? 'light' : 'dark';
  root.lang = ar ? 'ar' : 'en';
  root.dir = ar ? 'rtl' : 'ltr';
})();
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #030406;
  --surface: rgba(255, 255, 255, .045);
  --surface-2: rgba(255, 255, 255, .08);
  --border: rgba(255, 255, 255, .1);
  --text: #eef1f6;
  --muted: #9aa3b2;
  --ok: #6ee7b7;
  --warn: #fcd34d;
  --bad: #fca5a5;
  --r-card: 18px;
  --r-icon: .27;
  --r-chip: 9px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f8;
  --surface: rgba(255, 255, 255, .8);
  --surface-2: rgba(15, 23, 42, .06);
  --border: rgba(15, 23, 42, .12);
  --text: #11151c;
  --muted: #566070;
  --ok: #047857;
  --warn: #92400e;
  --bad: #b91c1c;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-block-size: 100dvh;
  color: var(--text);
  font: 15px/1.5 "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { max-inline-size: 980px; margin-inline: auto; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-block-end: 18px; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; flex: 1 1 auto; }
.meta { color: var(--muted); font-size: .85rem; inline-size: 100%; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-block-end: 18px; }
.btn, .toggle {
  min-block-size: 44px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--r-chip);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background-color .18s var(--ease), scale .18s var(--ease);
}
.toggle[aria-pressed="true"] { background: var(--surface-2); border-color: color-mix(in oklab, var(--text) 35%, transparent); }
.btn:active, .toggle:active { scale: .96; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover, .toggle:hover { background: var(--surface-2); }
}
.count { color: var(--muted); font-size: .85rem; margin-inline-start: auto; }
.app {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-card);
  padding: 14px;
  margin-block-end: 12px;
}
.app h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 600; }
.row {
  display: grid;
  grid-template-columns: 52px 52px 52px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  padding-block: 10px;
  border-block-start: 1px solid var(--border);
}
.row:first-of-type { border-block-start: 0; }
.cell { display: grid; justify-items: center; gap: 4px; font-size: .68rem; color: var(--muted); }
.fav, .tile {
  inline-size: 48px;
  block-size: 48px;
  border-radius: calc(48px * var(--r-icon));
  display: grid;
  place-items: center;
}
.fav { object-fit: cover; background: var(--surface-2); border: 1px solid var(--border); }
.tile { color: #fff; font-size: 22px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.tile .lx-glyph { inline-size: 26px; block-size: 26px; position: relative; display: inline-block; }
.tile .lx-glyph::before {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  -webkit-mask: var(--glyph) center / contain no-repeat;
  mask: var(--glyph) center / contain no-repeat;
}
.tile svg { inline-size: 1em; block-size: 1em; fill: currentColor; }
.none { color: var(--muted); font-size: 1rem; background: var(--surface-2); }
.info { min-inline-size: 0; display: grid; gap: 2px; }
.key { font-weight: 600; overflow-wrap: break-word; }
.line { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; border: 1px solid currentColor; }
.s-found, .s-override { color: var(--ok); }
.s-stale, .s-default { color: var(--warn); }
.s-blocked, .s-notfound { color: var(--bad); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
@media (max-width: 560px) {
  .row { grid-template-columns: 48px 48px 48px; }
  .info { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .toggle { transition: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="bar">
    <button class="toggle" id="attn" type="button" aria-pressed="false"></button>
    <a class="btn" id="runs" target="_blank" rel="noopener" href="https://github.com/datakid/app-launcher/actions/workflows/harvest.yml"></a>
    <span class="count" id="count"></span>
  </div>
  <div id="list" aria-live="polite"></div>
</main>
<script>
(function () {
  var AR = document.documentElement.lang === 'ar';
  var T = AR
    ? { title: 'الحصاد', attn: 'يحتاج انتباه', runs: 'تشغيل الحصاد على GitHub', fav: 'أيقونة', glyph: 'رمز', fa: 'احتياطي', checked: 'آخر فحص', source: 'المصدر', all: 'كل الأيقونات', of: 'من', gen: 'تم التوليد', fail: 'تعذر تحميل البيانات', empty: 'لا شيء يحتاج انتباه', noglyph: 'بلا رمز' }
    : { title: 'Harvest', attn: 'Needs attention', runs: 'Re-run on GitHub Actions', fav: 'Favicon', glyph: 'Glyph', fa: 'Fallback', checked: 'Checked', source: 'Source', all: 'All icons', of: 'of', gen: 'Generated', fail: 'Could not load data', empty: 'Nothing needs attention', noglyph: 'no glyph' };
  var URL_RE = /^icons\/[a-z0-9-]+(\.glyph)?\.png\?v=[0-9a-f]{8}$/;
  var HEX = /^#[0-9a-f]{6}$/i;
  var NAME_RE = /^fa-[a-z0-9-]+$/;
  var BAD = { stale: 1, blocked: 1, default: 1, notfound: 1 };
  var state = { attn: false, rows: [], total: 0 };

  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  var pick = function (v) { return v && typeof v === 'object' ? (AR ? v.ar : v.en) || v.en || v.ar : String(v || ''); };
  var gradient = function (g) {
    return Array.isArray(g) && g.length === 3 && g.every(function (c) { return HEX.test(c); }) ? 'linear-gradient(135deg,' + g[0] + ',' + g[2] + ')' : 'linear-gradient(135deg,#475569,#0f172a)';
  };
  var faTile = function (name, bg, sprite) {
    var t = el('div', 'tile');
    t.style.background = bg;
    if (name && NAME_RE.test(name) && sprite && sprite.querySelector('symbol[id="' + name + '"]')) {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('aria-hidden', 'true');
      var use = document.createElementNS(ns, 'use');
      use.setAttribute('href', '#' + name);
      svg.appendChild(use);
      t.appendChild(svg);
    } else {
      t.className = 'tile none';
      t.style.background = '';
      t.textContent = '—';
    }
    return t;
  };
  var cell = function (node, label) {
    var c = el('div', 'cell');
    c.appendChild(node);
    c.appendChild(el('span', '', label));
    return c;
  };
  var when = function (iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleString(AR ? 'ar' : 'en', { dateStyle: 'medium', timeStyle: 'short' });
  };

  var buildRows = function (links, manifest, report, sprite) {
    var items = {};
    (report.items || []).forEach(function (i) { items[i.key] = i; });
    var icons = manifest.icons || {};
    var seen = {};
    var groups = [];
    var addRow = function (g, key, label, faName, bg) {
      seen[key] = 1;
      g.rows.push({ key: key, label: label, faName: faName, bg: bg, entry: icons[key] || null, item: items[key] || null });
    };
    (links.categories || []).forEach(function (cat) {
      if (!cat || cat.id === 'mine') return;
      (cat.apps || []).forEach(function (app) {
        if (!app || typeof app.id !== 'string' || app.id.indexOf('u-') === 0) return;
        var g = { title: pick(app.title), rows: [] };
        var bg = gradient(app.gradient);
        if (Array.isArray(app.variants) && app.variants.length) {
          app.variants.forEach(function (v) { addRow(g, app.id + '--' + v.id, pick(v.label), v.icon || app.icon, bg); });
        } else {
          addRow(g, app.id, pick(app.title), app.icon, bg);
        }
        groups.push(g);
      });
    });
    var rest = { title: '+', rows: [] };
    Object.keys(items).concat(Object.keys(icons)).forEach(function (k) {
      if (!seen[k]) addRow(rest, k, k, null, gradient(null));
    });
    if (rest.rows.length) groups.push(rest);
    return groups;
  };

  var needs = function (r) {
    var s = r.entry ? r.entry.status : (r.item ? r.item.status : 'notfound');
    return !!BAD[s] || (!!r.entry && !!r.entry.favicon && !r.entry.glyph && s !== 'override');
  };

  var render = function (groups, sprite) {
    var list = document.getElementById('list');
    list.textContent = '';
    var shown = 0;
    groups.forEach(function (g) {
      var rows = g.rows.filter(function (r) { return !state.attn || needs(r); });
      if (!rows.length) return;
      var box = el('section', 'app');
      box.appendChild(el('h2', '', g.title));
      rows.forEach(function (r) {
        shown++;
        var e = r.entry;
        var status = e ? e.status : (r.item ? r.item.status : 'notfound');
        var row = el('div', 'row');
        var fav;
        if (e && e.favicon && URL_RE.test(e.favicon)) {
          fav = el('img', 'fav');
          fav.src = '../' + e.favicon;
          fav.alt = '';
          fav.width = 48;
          fav.height = 48;
          fav.loading = 'lazy';
        } else {
          fav = el('div', 'fav none', '—');
        }
        var glyph;
        if (e && e.glyph && URL_RE.test(e.glyph)) {
          glyph = el('div', 'tile');
          glyph.style.background = r.bg;
          var gl = el('span', 'lx-glyph');
          gl.style.setProperty('--glyph', 'url(../' + e.glyph + ')');
          gl.setAttribute('aria-hidden', 'true');
          glyph.appendChild(gl);
        } else {
          glyph = el('div', 'tile none', '—');
        }
        row.appendChild(cell(fav, T.fav));
        row.appendChild(cell(glyph, T.glyph));
        row.appendChild(cell(faTile(r.faName, r.bg, sprite), T.fa));
        var info = el('div', 'info');
        var head = el('div', 'key');
        head.appendChild(document.createTextNode(r.label + ' '));
        head.appendChild(el('span', 'chip s-' + status, status));
        info.appendChild(head);
        info.appendChild(el('div', 'line', r.key));
        var src = r.item && r.item.source ? r.item.source.type + ' ' + (r.item.source.href || '') : '—';
        info.appendChild(el('div', 'line', T.checked + ': ' + when(e && e.checkedAt) + ' · ' + T.source + ': ' + src));
        var note = (r.item && r.item.error) || '';
        if (e && e.favicon && !e.glyph && status !== 'override') note = (note ? note + ' · ' : '') + T.noglyph;
        if (note) info.appendChild(el('div', 'line', note));
        row.appendChild(info);
        box.appendChild(row);
      });
      list.appendChild(box);
    });
    if (!shown) list.appendChild(el('div', 'empty', T.empty));
    document.getElementById('count').textContent = shown + ' ' + T.of + ' ' + state.total;
  };

  var json = function (url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.json();
    });
  };
  var text = function (url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.text();
    });
  };

  document.getElementById('title').textContent = T.title;
  document.getElementById('runs').textContent = T.runs;
  var attn = document.getElementById('attn');
  attn.textContent = T.attn;

  Promise.all([json('../icons/manifest.json'), json('report.json'), json('../links.json'), text('../index.html').catch(function () { return ''; })])
    .then(function (res) {
      var manifest = res[0];
      var report = res[1];
      var links = res[2];
      var sprite = null;
      var m = /<svg aria-hidden="true"[^>]*><defs>[\s\S]*?<\/defs><\/svg>/.exec(res[3]);
      if (m) {
        var doc = new DOMParser().parseFromString(m[0], 'text/html');
        sprite = doc.querySelector('svg');
        if (sprite) {
          sprite.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden');
          document.body.appendChild(document.importNode(sprite, true));
          sprite = document.body.lastElementChild;
        }
      }
      var groups = buildRows(links, manifest, report, sprite);
      state.total = groups.reduce(function (n, g) { return n + g.rows.length; }, 0);
      document.getElementById('meta').textContent = T.gen + ': ' + when(manifest.generatedAt);
      attn.addEventListener('click', function () {
        state.attn = !state.attn;
        attn.setAttribute('aria-pressed', String(state.attn));
        render(groups, sprite);
      });
      render(groups, sprite);
    })
    .catch(function (e) {
      document.getElementById('list').appendChild(el('div', 'empty', T.fail + ': ' + (e && e.message ? e.message : e)));
    });
})();
</script>
</body>
</html>
