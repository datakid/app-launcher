<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkExpress · Look comparison</title>
<style>
  :root { color-scheme: dark; --bg: #0b0c0f; --ink: #ecebe7; --muted: rgba(236,235,231,.5); --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .compare-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem 1.2rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .compare-bar h1 { font-size: .8rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .compare-controls { display: flex; gap: 1rem; }
  .compare-bar label { font-size: .78rem; color: var(--muted); display: inline-flex; align-items: center; gap: .5rem; }
  .compare-bar select { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .5rem; font: inherit; }
  .compare-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; min-height: 0; }
  .compare-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .compare-pane header { padding: .5rem 1rem; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .compare-pane header strong { color: var(--ink); font-weight: 600; margin-inline-end: .5rem; }
  .compare-pane iframe { flex: 1; width: 100%; border: 0; background: #000; }
  @media (max-width: 900px) { .compare-grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, 70vh); overflow-y: auto; } }
</style>
</head>
<body>
<header class="compare-bar">
  <h1>Look comparison</h1>
  <div class="compare-controls">
    <label for="compare-theme">Theme
      <select id="compare-theme">
        <option value="">As saved</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
    <label for="compare-corners">Corners
      <select id="compare-corners">
        <option value="balanced">Balanced</option>
        <option value="soft">Soft</option>
        <option value="crisp">Crisp</option>
      </select>
    </label>
  </div>
</header>
<main class="compare-grid" id="compare-grid">
  <section class="compare-pane"><header><strong>Curated</strong>eight shared tones</header><iframe data-palette="curated" title="Curated"></iframe></section>
  <section class="compare-pane"><header><strong>Muted</strong>own hues, softened</header><iframe data-palette="muted" title="Muted"></iframe></section>
  <section class="compare-pane"><header><strong>Vivid</strong>own hues, full glow</header><iframe data-palette="vivid" title="Vivid"></iframe></section>
  <section class="compare-pane"><header><strong>Monochrome</strong>graphite, no hue</header><iframe data-palette="mono" title="Monochrome"></iframe></section>
</main>
<script>
(function () {
  var theme = document.getElementById('compare-theme');
  var corners = document.getElementById('compare-corners');
  var frames = Array.prototype.slice.call(document.querySelectorAll('iframe[data-palette]'));
  var load = function () {
    frames.forEach(function (f) { f.src = 'index.html?palette=' + f.dataset.palette + '&corners=' + corners.value; });
  };
  theme.addEventListener('change', function () {
    if (!theme.value) return;
    try { localStorage.setItem('lx-theme', theme.value); } catch (e) {}
    load();
  });
  corners.addEventListener('change', load);
  load();
})();
</script>
</body>
</html>
