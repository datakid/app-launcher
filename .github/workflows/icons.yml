name: Icons

on:
  push:
    branches: [main]
    paths: [links.json]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  icons:
    permissions:
      contents: write
      pull-requests: write
    uses: datakid/harvest-studio/.github/workflows/harvest-icons.yml@main
    with:
      set: launcher
      target: v4
      studio-ref: main
      links-path: links.json
      icons-dir: icons
      base-sha: ${{ github.event.before }}
      head-sha: ${{ github.sha }}
    secrets: inherit
