<script>
(function () {
  try {
    var theme = localStorage.getItem('lx-theme');
    var isLight = (theme === 'light' || theme === 'dark')
      ? theme === 'light'
      : window.matchMedia('(prefers-color-scheme: light)').matches;
    var storedLang = localStorage.getItem('lx-lang');

      ? storedLang

    root.dir = lang === 'en' ? 'ltr' : 'rtl';
    var fontPair = lang === 'ar' ? ['ibm-plex-sans-arabic-arabic-400-normal', 'el-messiri-arabic-700-normal'] : ['inter-latin-400-normal', 'cormorant-garamond-latin-400-italic'];
    fontPair.forEach(function (face) {
      var fontLink = document.createElement('link');
      fontLink.rel = 'preload';
      fontLink.as = 'font';
      fontLink.type = 'font/woff2';
      fontLink.href = 'fonts/' + face + '.woff2';
      fontLink.crossOrigin = '';
      document.head.appendChild(fontLink);
    });
    var paletteParam = (location.search.match(/[?&]palette=(muted|curated|vivid|mono)\b/) || [])[1];
    var storedPalette = localStorage.getItem('lx-palette');
    root.dataset.palette = paletteParam || (/^(muted|curated|vivid|mono)$/.test(storedPalette || '') ? storedPalette : 'vivid');
    if (paletteParam) root.dataset.paletteLocked = '1';
    var cornersParam = (location.search.match(/[?&]corners=(soft|balanced|crisp)\b/) || [])[1];
    var storedCorners = localStorage.getItem('lx-corners');
    root.dataset.corners = cornersParam || (/^(soft|balanced|crisp)$/.test(storedCorners || '') ? storedCorners : 'balanced');
    if (cornersParam) root.dataset.cornersLocked = '1';
    var viewParam = (location.search.match(/[?&]view=(bento|list|icons)\b/) || [])[1];
    var storedView = localStorage.getItem('lx-view');
    root.dataset.view = viewParam || (/^(bento|list|icons)$/.test(storedView || '') ? storedView : 'bento');
    if (viewParam) root.dataset.viewLocked = '1';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isLight ? '#f3f1ec' : '#030406');
    if (/^https?:$/.test(location.protocol) && window.fetch) {
      window.__lxCatalog = fetch('links.json', { cache: 'no-cache', credentials: 'same-origin', mode: 'same-origin' }).catch(function () { return null; });
      window.__lxIcons = fetch('icons/manifest.v2.json', { credentials: 'same-origin', mode: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      try {
        if (/[?&]motion=legacy(&|$)/.test(location.search)) document.documentElement.dataset.motion = 'legacy';
      } catch (e) {}
      try {
        var cachedIcons = JSON.parse(localStorage.getItem('lx-icons') || 'null');
        var needAtlas = false;
        if (cachedIcons && cachedIcons.version === 2 && cachedIcons.icons) {
          for (var iconKey in cachedIcons.icons) {
            var iconEntry0 = cachedIcons.icons[iconKey];
            if (iconEntry0 && iconEntry0.favicon && !iconEntry0.glyph && iconEntry0.status !== 'default') { needAtlas = true; break; }
          }
        }
        if (needAtlas && cachedIcons.atlas && /^icons\/atlas\.[0-9a-f]{8}\.webp$/.test(cachedIcons.atlas.file)) {
          var atlasPreload = document.createElement('link');
          atlasPreload.rel = 'preload';
          atlasPreload.as = 'image';
          atlasPreload.href = cachedIcons.atlas.file;
          atlasPreload.setAttribute('fetchpriority', 'low');
          document.head.appendChild(atlasPreload);
        }
      } catch (e) {}
    }
  } catch (e) {
    if (location.search.indexOf('lxdebug=1') !== -1) console.warn(e);
  }
})();
</script>

    <span class="palette-mode" id="paletteMode" hidden><svg class="fas fa-bolt" aria-hidden="true" focusable="false"><use href="#fa-bolt"></use></svg><span data-i18n="commandsGroup">الأوامر</span></span>
    <div class="palette-input-wrap">
      <span class="palette-ghost" id="paletteGhost" aria-hidden="true"></span>
      <input id="paletteInput" type="text" role="combobox" aria-expanded="true" aria-controls="paletteResults"
        aria-autocomplete="list" placeholder="ابحث عن تطبيق أو أداة…" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder">
    </div>
    <button type="button" class="palette-close" id="paletteClose" aria-label="إغلاق" data-i18n-aria="hintClose"><kbd aria-hidden="true">Esc</kbd><span class="palette-close-touch" aria-hidden="true">×</span></button>
  </div>
  <div class="palette-scopes" id="paletteScopes" role="radiogroup" aria-label="النطاق" data-i18n-aria="scopesLabel">
    <span class="palette-scope-indicator" aria-hidden="true"></span>
  </div>
  <div class="palette-body">
    <ul class="palette-results" id="paletteResults" role="listbox" aria-label="النتائج" data-i18n-aria="resultsLabel"></ul>
    <div class="palette-detail" id="paletteDetail"></div>
  </div>
  <div class="palette-hints">
    <span id="paletteStatus" class="palette-status" aria-hidden="true"></span>
    <span><kbd>↑↓</kbd> <span data-i18n="hintNavigate">تنقل</span></span>
    <span><kbd>⇥</kbd> <span data-i18n="hintSwitchPanel">تبديل اللوحة</span></span>
    <span><kbd>↵</kbd> <span data-i18n="hintOpen">فتح</span></span>
    <span><kbd>&gt;</kbd> <span data-i18n="hintCommands">الأوامر</span></span>
    <span class="palette-hint-scope"><kbd>⇧⇥</kbd> <span data-i18n="hintScope">النطاق</span></span>
    <span><kbd>Esc</kbd> <span data-i18n="hintClose">إغلاق</span></span>
  </div>
  <div id="paletteLive" class="visually-hidden" aria-live="polite"></div>
</dialog>

<dialog id="lx-qr" aria-labelledby="qrTitle">
  <div class="qr-head">
    <span class="qr-head-icon" id="qrIcon" aria-hidden="true"></span>
    <span class="qr-head-text">
      <span class="qr-title" id="qrTitle"></span>
      <span class="qr-host" id="qrHost"></span>
    </span>
    <button type="button" class="qr-close" id="qrClose" aria-label="إغلاق" data-i18n-aria="hintClose"><svg class="fas fa-xmark" aria-hidden="true" focusable="false"><use href="#fa-xmark"></use></svg></button>
  </div>
  <div class="qr-variants" id="qrVariants" role="radiogroup" hidden></div>
  <div class="qr-stage" id="qrStage"></div>
  <p class="qr-note" id="qrNote" hidden></p>
  <div class="qr-actions">
    <button type="button" class="qr-action is-primary" data-qr="copy"><svg class="fas fa-copy" aria-hidden="true" focusable="false"><use href="#fa-copy"></use></svg><span class="qr-action-label" data-i18n="actionCopyLink">نسخ الرابط</span></button>
    <button type="button" class="qr-action" data-qr="png"><svg class="fas fa-download" aria-hidden="true" focusable="false"><use href="#fa-download"></use></svg><span class="qr-action-label" data-i18n="qrPng">تنزيل PNG</span></button>
    <button type="button" class="qr-action" data-qr="svg"><svg class="fas fa-download" aria-hidden="true" focusable="false"><use href="#fa-download"></use></svg><span class="qr-action-label" data-i18n="qrSvg">تنزيل SVG</span></button>
    <button type="button" class="qr-action" data-qr="share" hidden><svg class="fas fa-arrow-up-right-from-square" aria-hidden="true" focusable="false"><use href="#fa-arrow-up-right-from-square"></use></svg><span class="qr-action-label" data-i18n="qrShare">مشاركة</span></button>
  </div>
  <p class="qr-hint" data-i18n="qrHint">امسح الرمز بكاميرا الهاتف لفتح الرابط</p>
</dialog>

<!--LX:DATA-->
<!--LX:JS-->
</body>
</html>
